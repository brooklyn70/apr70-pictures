<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="min-height:140px; padding:20px 24px;">
  <div class="tag" style="margin-bottom:16px;">BADGES &amp; STATUS</div>
  <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
    <span style="display:inline-flex; align-items:center; gap:10px; font-family:'Barlow',sans-serif; font-weight:500; font-size:9px; letter-spacing:0.5em; text-transform:uppercase; color:#077082;"><span style="width:20px; height:1px; background:#077082;"></span>IN DEVELOPMENT</span>
    <span style="display:inline-flex; align-items:center; gap:10px; font-family:'Barlow',sans-serif; font-weight:500; font-size:9px; letter-spacing:0.5em; text-transform:uppercase; color:#E85D04;"><span style="width:20px; height:1px; background:#E85D04;"></span>IN PRODUCTION</span>
    <span style="display:inline-flex; align-items:center; gap:10px; font-family:'Barlow',sans-serif; font-weight:500; font-size:9px; letter-spacing:0.5em; text-transform:uppercase; color:#824B07;"><span style="width:20px; height:1px; background:#824B07;"></span>OPTIONED</span>
    <span style="display:inline-flex; align-items:center; gap:10px; font-family:'Barlow',sans-serif; font-weight:500; font-size:9px; letter-spacing:0.5em; text-transform:uppercase; color:rgba(255,255,255,0.35);"><span style="width:20px; height:1px; background:rgba(255,255,255,0.35);"></span>ARCHIVED</span>
  </div>
</div>
</body></html>
