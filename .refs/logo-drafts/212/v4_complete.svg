<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" aria-label="(212) Pictures v4 — master">
  <title>(212) Pictures — v4 Master</title>
  <desc>Editable layered logo. Each top-level group is a separate Photoshop/Illustrator layer.</desc>

  <!-- ARCS LAYER — three picasso lines + entry dot, sitting overhead. Scaled 30% smaller than v3. -->
  <g id="arcs" transform="rotate(-45 250 189)">
    <g id="arc-strokes" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round">
      <path id="arc-outer"  d="M 301 100.7 A 102 102 0 0 1 352 189"/>
      <path id="arc-middle" d="M 322.7 147 A 84 84 0 0 1 334 189"/>
      <path id="arc-inner"  d="M 283.5 131 A 67 67 0 0 1 317 189"/>
    </g>
    <circle id="dial-dot" cx="301" cy="100.7" r="11" fill="#E85D04"/>
  </g>

  <!-- WORDMARK LAYER — v1 lockup with parens reduced 5% (200→190). Digits unchanged. -->
  <g id="wordmark" font-family="Futura Std, Futura, Arial Black, sans-serif" stroke="none">
    <text id="paren-left"  x="125" y="290" font-weight="900" font-size="190" letter-spacing="0"  fill="#824B07">(</text>
    <g id="digits">
      <text id="digit-2a" x="175" y="290" font-weight="900" font-size="170" letter-spacing="-8" fill="#824B07">2</text>
      <text id="digit-1"  x="255" y="290" font-weight="900" font-size="170" letter-spacing="-8" fill="#E85D04">1</text>
      <text id="digit-2b" x="310" y="290" font-weight="900" font-size="170" letter-spacing="-8" fill="#824B07">2</text>
    </g>
    <text id="paren-right" x="370" y="290" font-weight="900" font-size="190" letter-spacing="0"  fill="#824B07">)</text>
  </g>

  <!-- PICTURES LAYER — spans the digit width (P at left of first 2, S at right of second 2), 15px gap above. -->
  <text id="pictures" x="175" y="330" font-family="Futura Std, Futura, Arial, sans-serif" font-weight="700" font-size="38" letter-spacing="7" fill="#000000" stroke="none">PICTURES</text>
</svg>
