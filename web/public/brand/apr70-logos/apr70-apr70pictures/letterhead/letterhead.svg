<svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg">
  <!-- US Letter: 8.5" x 11" at 72px/inch -->
  <rect width="612" height="792" fill="#FFF"/>
  
  <!-- Header area with logo -->
  <g transform="translate(50, 45)">
    <!-- Film strip logo -->
    <rect x="0" y="0" width="140" height="44" fill="#000"/>
    <!-- Left sprocket holes -->
    <rect x="5" y="7" width="4" height="2.8" rx="0.5" fill="#FFF"/>
    <rect x="5" y="14" width="4" height="2.8" rx="0.5" fill="#FFF"/>
    <rect x="5" y="21" width="4" height="2.8" rx="0.5" fill="#FFF"/>
    <rect x="5" y="28" width="4" height="2.8" rx="0.5" fill="#FFF"/>
    <rect x="5" y="35" width="4" height="2.8" rx="0.5" fill="#FFF"/>
    <!-- Right sprocket holes -->
    <rect x="131" y="7" width="4" height="2.8" rx="0.5" fill="#FFF"/>
    <rect x="131" y="14" width="4" height="2.8" rx="0.5" fill="#FFF"/>
    <rect x="131" y="21" width="4" height="2.8" rx="0.5" fill="#FFF"/>
    <rect x="131" y="28" width="4" height="2.8" rx="0.5" fill="#FFF"/>
    <rect x="131" y="35" width="4" height="2.8" rx="0.5" fill="#FFF"/>
    <!-- APR 70 text -->
    <text x="70" y="28" font-family="Futura, Futura-Bold, Century Gothic, sans-serif" font-size="17" font-weight="700" fill="#FFF" text-anchor="middle" letter-spacing="0.16em">APR 70</text>
  </g>
  
  <!-- Contact info aligned right in header -->
  <text x="562" y="58" font-family="Futura, Century Gothic, sans-serif" font-size="8" font-weight="400" fill="#000" text-anchor="end" letter-spacing="0.02em">Marc Andrew Caruso</text>
  <text x="562" y="70" font-family="Futura, Century Gothic, sans-serif" font-size="8" font-weight="400" fill="#000" text-anchor="end" letter-spacing="0.02em">caruso@apr70.com</text>
  <text x="562" y="82" font-family="Futura, Century Gothic, sans-serif" font-size="8" font-weight="400" fill="#000" text-anchor="end" letter-spacing="0.02em">917.613.0728</text>
  
  <!-- Thin divider line -->
  <line x1="50" y1="105" x2="562" y2="105" stroke="#000" stroke-width="0.5"/>
  
  <!-- Footer -->
  <line x1="50" y1="740" x2="562" y2="740" stroke="#000" stroke-width="0.5"/>
  <text x="50" y="760" font-family="Futura, Century Gothic, sans-serif" font-size="7" font-weight="400" fill="#666" letter-spacing="0.02em">1063 Jackson Avenue, PH G, LIC NY 11101</text>
  <text x="562" y="760" font-family="Futura, Century Gothic, sans-serif" font-size="7" font-weight="400" fill="#666" text-anchor="end" letter-spacing="0.02em">apr70.com</text>
</svg>
