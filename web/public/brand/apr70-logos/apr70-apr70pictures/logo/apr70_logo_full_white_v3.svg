<svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="120" fill="#FFF"/>
  <!-- Left sprocket holes -->
  <rect x="12" y="20" width="8" height="5.6" rx="1" fill="#000"/>
  <rect x="12" y="34" width="8" height="5.6" rx="1" fill="#000"/>
  <rect x="12" y="48" width="8" height="5.6" rx="1" fill="#000"/>
  <rect x="12" y="62" width="8" height="5.6" rx="1" fill="#000"/>
  <rect x="12" y="76" width="8" height="5.6" rx="1" fill="#000"/>
