<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" aria-label="(212) Pictures — Variant A: PICTURES letters mirrored inside 8 finger holes, faithful Western Electric rotary geometry">
  <!-- Background dial face (solid). Use currentColor for the dial body so it can be inverted via CSS. -->
  <circle cx="250" cy="250" r="230" fill="currentColor" stroke="none"/>

  <!-- Outer rim hairline (subtle bevel reference, knocks out of fill) -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="white" stroke-opacity="0.18" stroke-width="0.8"/>

  <!-- FINGER-STOP — small bracket/tab on the right side at clock-3:30 position.
       Real Western Electric: small raised metal piece that catches the finger. -->
  <g>
    <!-- Inner support post -->
    <rect x="416" y="244" width="14" height="12" rx="1" fill="white" stroke="none"/>
    <!-- Outer hook arm -->
    <path d="M 416 256 L 416 280 L 430 280 L 430 256 Z" fill="white" stroke="none"/>
    <!-- Subtle shadow under the stop -->
    <path d="M 416 280 L 416 282 L 430 282 L 430 280 Z" fill="black" fill-opacity="0.3" stroke="none"/>
  </g>

  <!-- DIAL FACE LABELS — outside the holes, between hole-ring (r=165) and outer ring (r=230).
       Each label: letter group (smaller) above digit (larger), both in white.
       Label center placed at r=200 from dial center. -->
  <g fill="white" stroke="none" font-family="Futura Std, Futura, Arial, sans-serif" text-anchor="middle">
    <!-- 1 at 60° (clock-2, upper-right): just the digit, no letters -->
    <text x="423.2" y="125" font-weight="500" font-size="22">1</text>

    <!-- 2 at 30° (upper-right): ABC over 2 -->
    <text x="350" y="48" font-weight="500" font-size="11" letter-spacing="1">ABC</text>
    <text x="350" y="68" font-weight="500" font-size="22">2</text>

    <!-- 3 at 0° (top): DEF over 3 -->
    <text x="250" y="29" font-weight="500" font-size="11" letter-spacing="1">DEF</text>
    <text x="250" y="49" font-weight="500" font-size="22">3</text>

    <!-- 4 at 330° (upper-left): GHI over 4 -->
    <text x="150" y="48" font-weight="500" font-size="11" letter-spacing="1">GHI</text>
    <text x="150" y="68" font-weight="500" font-size="22">4</text>

    <!-- 5 at 300° (left): JKL over 5 -->
    <text x="76.8" y="125" font-weight="500" font-size="11" letter-spacing="1">JKL</text>
    <text x="76.8" y="145" font-weight="500" font-size="22">5</text>

    <!-- 6 at 270° (clock-9, left): MNO over 6 -->
    <text x="50" y="246" font-weight="500" font-size="11" letter-spacing="1">MNO</text>
    <text x="50" y="266" font-weight="500" font-size="22">6</text>

    <!-- 7 at 240° (lower-left): PRS over 7 -->
    <text x="76.8" y="368" font-weight="500" font-size="11" letter-spacing="1">PRS</text>
    <text x="76.8" y="388" font-weight="500" font-size="22">7</text>

    <!-- 8 at 210° (bottom-left): TUV over 8 -->
    <text x="150" y="445" font-weight="500" font-size="11" letter-spacing="1">TUV</text>
    <text x="150" y="465" font-weight="500" font-size="22">8</text>

    <!-- 9 at 180° (bottom): WXY over 9 -->
    <text x="250" y="464" font-weight="500" font-size="11" letter-spacing="1">WXY</text>
    <text x="250" y="484" font-weight="500" font-size="22">9</text>

    <!-- 0 at 150° (lower-right): OPERATOR over 0 -->
    <text x="350" y="445" font-weight="500" font-size="8" letter-spacing="0.5">OPERATOR</text>
    <text x="350" y="465" font-weight="500" font-size="22">0</text>
  </g>

  <!-- 10 FINGER HOLES (cut-outs from the dial face).
       Holes are RECESSED — visually the cream/light "inside" of the phone shell shows through.
       For SVG, we knock out by filling with the contrast color (handled via CSS background).
       Here we render holes as filled with a "phone cream" tone — but in the live SVG they'll be
       set to transparent via the `.hole` class. -->

  <g class="holes">
    <!-- Hole 1 at 60° (upper-right) -->
    <circle cx="392.9" cy="167.5" r="26" fill="#1a1a1a" stroke="white" stroke-opacity="0.4" stroke-width="0.6"/>
    <!-- Hole 2 at 30° -->
    <circle cx="332.5" cy="107.1" r="26" fill="#1a1a1a" stroke="white" stroke-opacity="0.4" stroke-width="0.6"/>
    <!-- Hole 3 at 0° -->
    <circle cx="250" cy="85" r="26" fill="#1a1a1a" stroke="white" stroke-opacity="0.4" stroke-width="0.6"/>
    <!-- Hole 4 at 330° -->
    <circle cx="167.5" cy="107.1" r="26" fill="#1a1a1a" stroke="white" stroke-opacity="0.4" stroke-width="0.6"/>
    <!-- Hole 5 at 300° -->
    <circle cx="107.1" cy="167.5" r="26" fill="#1a1a1a" stroke="white" stroke-opacity="0.4" stroke-width="0.6"/>
    <!-- Hole 6 at 270° -->
    <circle cx="85" cy="250" r="26" fill="#1a1a1a" stroke="white" stroke-opacity="0.4" stroke-width="0.6"/>
    <!-- Hole 7 at 240° -->
    <circle cx="107.1" cy="332.5" r="26" fill="#1a1a1a" stroke="white" stroke-opacity="0.4" stroke-width="0.6"/>
    <!-- Hole 8 at 210° -->
    <circle cx="167.5" cy="392.9" r="26" fill="#1a1a1a" stroke="white" stroke-opacity="0.4" stroke-width="0.6"/>
    <!-- Hole 9 at 180° (no letter — blank) -->
    <circle cx="250" cy="415" r="26" fill="#1a1a1a" stroke="white" stroke-opacity="0.4" stroke-width="0.6"/>
    <!-- Hole 0 at 150° (no letter — blank) -->
    <circle cx="332.5" cy="392.9" r="26" fill="#1a1a1a" stroke="white" stroke-opacity="0.4" stroke-width="0.6"/>
  </g>

  <!-- PICTURES letters INSIDE 8 finger holes, MIRRORED (horizontally flipped),
       reading right-to-left from hole 1 (rightmost) through hole 8.
       Holes 9 and 0 stay empty. -->
  <g fill="white" stroke="none" font-family="Futura Std, Futura, Arial, sans-serif" font-weight="700" font-size="22" text-anchor="middle">
    <!-- Hole 1 (upper-right): P, mirrored -->
    <g transform="translate(392.9 175) scale(-1 1)"><text x="0" y="0">P</text></g>
    <!-- Hole 2: I, mirrored -->
    <g transform="translate(332.5 114.6) scale(-1 1)"><text x="0" y="0">I</text></g>
    <!-- Hole 3: C, mirrored -->
    <g transform="translate(250 92.5) scale(-1 1)"><text x="0" y="0">C</text></g>
    <!-- Hole 4: T, mirrored -->
    <g transform="translate(167.5 114.6) scale(-1 1)"><text x="0" y="0">T</text></g>
    <!-- Hole 5: U, mirrored -->
    <g transform="translate(107.1 175) scale(-1 1)"><text x="0" y="0">U</text></g>
    <!-- Hole 6: R, mirrored -->
    <g transform="translate(85 257.5) scale(-1 1)"><text x="0" y="0">R</text></g>
    <!-- Hole 7: E, mirrored -->
    <g transform="translate(107.1 340) scale(-1 1)"><text x="0" y="0">E</text></g>
    <!-- Hole 8: S, mirrored -->
    <g transform="translate(167.5 400.4) scale(-1 1)"><text x="0" y="0">S</text></g>
  </g>

  <!-- CENTER HUB — printed card holder showing "AREA CODE 212" -->
  <circle cx="250" cy="250" r="78" fill="#e8ddb5" stroke="white" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="250" y="232" font-family="Futura Std, Futura, Arial, sans-serif" font-weight="500" font-size="10" letter-spacing="1.5" text-anchor="middle" fill="#1c1208" stroke="none">AREA CODE</text>
  <text x="250" y="282" font-family="Futura Std, Futura, Arial Black, sans-serif" font-weight="900" font-size="48" letter-spacing="-1" text-anchor="middle" fill="#1c1208" stroke="none">212</text>
</svg>
