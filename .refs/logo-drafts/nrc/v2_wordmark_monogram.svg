<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" aria-label="New Renaissance Cinema v2 — monogram + stacked wordmark">
  <title>NRC v2 — Monogram and Wordmark</title>
  <desc>Vertical lockup. The NRC monogram dominates; the full name NEW RENAISSANCE CINEMA sits beneath as a single tracked line. EST line in Share Tech Mono as a slate-card meta footer.</desc>

  <!-- NRC monogram — huge, center R in navy as the accent -->
  <g id="monogram" font-family="Futura Std, Futura, Arial Black, sans-serif" stroke="none">
    <text id="letter-N" x="105" y="270" font-weight="900" font-size="180" letter-spacing="-10" fill="#C8C8C8">N</text>
    <text id="letter-R" x="225" y="270" font-weight="900" font-size="180" letter-spacing="-10" fill="#001F3F">R</text>
    <text id="letter-C" x="345" y="270" font-weight="900" font-size="180" letter-spacing="-10" fill="#C8C8C8">C</text>
  </g>

  <!-- Hairline rule beneath the monogram — editorial device -->
  <line id="rule" x1="105" y1="305" x2="455" y2="305" stroke="#C8C8C8" stroke-width="1.5"/>

  <!-- Full company name — set wide, tight tracking, all caps -->
  <text id="company-name" x="280" y="345" font-family="Futura Std, Futura, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="8" text-anchor="middle" fill="#C8C8C8" stroke="none">NEW RENAISSANCE CINEMA</text>

  <!-- Slate-card meta footer in Share Tech Mono -->
  <text id="established" x="280" y="380" font-family="Share Tech Mono, Courier New, monospace" font-size="12" letter-spacing="6" text-anchor="middle" fill="#001F3F" stroke="none">EST · MMXXVI · NEW YORK</text>
</svg>
