<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" aria-label="(212) Pictures — small separated parens, v1 digit crush preserved, PICTURES narrowed">
  <defs>
    <pattern id="transparency" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#ffffff"/>
      <rect width="10" height="10" x="0" y="0" fill="#cccccc"/>
      <rect width="10" height="10" x="10" y="10" fill="#cccccc"/>
    </pattern>
  </defs>
  <rect width="500" height="500" fill="url(#transparency)"/>

  <!-- Picasso arcs — unchanged geometry, unchanged rotation. -->
  <g transform="rotate(-45 250 210)">
    <g fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round">
      <path d="M 322.5 84.4 A 145 145 0 0 1 395.0 210.0"/>
      <path d="M 353.9 150.0 A 120 120 0 0 1 370.0 210.0"/>
      <path d="M 297.5 127.7 A 95 95 0 0 1 345.0 210.0"/>
    </g>
    <circle cx="322.5" cy="84.4" r="14" fill="#E85D04" stroke="none"/>
  </g>

  <!-- (212) — digits keep v1 crush (font 120, letter-spacing -6, tight x positions).
       Parens SMALLER than digits (font 90) and SEPARATED from them by ~15px.
       This inverts the v1 paren-dominance — now the digits are the hero and parens are quiet bookends. -->
  <g font-family="Futura Std, Futura, Arial Black, sans-serif" fill="#000000" stroke="none">
    <text x="133" y="235" font-weight="900" font-size="90" letter-spacing="0">(</text>
    <text x="184" y="235" font-weight="900" font-size="120" letter-spacing="-6">2</text>
    <text x="241" y="235" font-weight="900" font-size="120" letter-spacing="-6" fill="#E85D04">1</text>
    <text x="281" y="235" font-weight="900" font-size="120" letter-spacing="-6">2</text>
    <text x="363" y="235" font-weight="900" font-size="90" letter-spacing="0">)</text>
  </g>

  <!-- PICTURES — narrowed: font 26, letter-spacing 3. Width ~135px, comfortably inside the
       parens lockup width (~266px). Sits tight under the wordmark. -->
  <text x="250" y="272" font-family="Futura Std, Futura, Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="3" text-anchor="middle" fill="#000000">PICTURES</text>
</svg>
