<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="#000"/>
  <!-- Left sprocket holes (3 for compact size) -->
  <rect x="4" y="12" width="4" height="2.8" rx="0.5" fill="#FFF"/>
  <rect x="4" y="30" width="4" height="2.8" rx="0.5" fill="#FFF"/>
  <rect x="4" y="48" width="4" height="2.8" rx="0.5" fill="#FFF"/>
  <!-- Right sprocket holes -->
  <rect x="56" y="12" width="4" height="2.8" rx="0.5" fill="#FFF"/>
  <rect x="56" y="30" width="4" height="2.8" rx="0.5" fill="#FFF"/>
  <rect x="56" y="48" width="4" height="2.8" rx="0.5" fill="#FFF"/>
  <!-- 70 text - Futura Bold -->
  <text x="32" y="40" font-family="Futura, Futura-Bold, Century Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFF" text-anchor="middle" letter-spacing="0.08em">70</text>
</svg>
