<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" aria-label="(212) Pictures — Variant 3: three arches over wordmark, Saul Bass discipline, 1950 cream stock">
  <!-- 1950s newsprint cream — the kind of card stock 'New Yorker' ads were printed on.
       Background so the mark is visible against any preview environment. In production
       the rect can be stripped and the mark sits on transparent. -->
  <rect width="500" height="500" fill="#F0E5C8"/>

  <!-- THREE ARCHES — concentric arcs forming the upper rim of an imaginary rotary tilted
       toward the viewer. Center of the arcs is BELOW the canvas at y=400.
       Arc widths echo the 2-1-2 dial pattern:
         • Outer (top): wide arc — the first "2"
         • Middle: narrow arc — the "1" (closer to finger-stop = shorter motion)
         • Inner (lowest): wide arc — the second "2"
       The "lowest" arc sits directly above the 212 wordmark, as you specified. -->
  <g fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round">
    <path d="M 110.0 157.5 A 280 280 0 0 1 390.0 157.5"/>
    <path d="M 187.9 168.2 A 240 240 0 0 1 312.1 168.2"/>
    <path d="M 150.0 226.8 A 200 200 0 0 1 350.0 226.8"/>
  </g>

  <!-- 212 — Futura Heavy, no parens. Set the way it appears printed on the rotary's
       center number card: confident, clean, all caps weight. The "1" carries the
       single Sicilian orange beat — echoing the dial's pivot digit. -->
  <g font-family="Futura Std, Futura, Arial Black, sans-serif" font-weight="900" font-size="118" letter-spacing="-4" text-anchor="middle">
    <text x="195" y="345" fill="#000000">2</text>
    <text x="250" y="345" fill="#E85D04">1</text>
    <text x="305" y="345" fill="#000000">2</text>
  </g>

  <!-- PICTURES — Futura Bold, tracked wide, anchored beneath. Black, no decoration. -->
  <text x="250" y="410" font-family="Futura Std, Futura, Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="16" text-anchor="middle" fill="#000000">PICTURES</text>
</svg>
