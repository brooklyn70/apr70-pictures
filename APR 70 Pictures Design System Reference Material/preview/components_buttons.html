<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="min-height:140px; padding:20px 24px;">
  <div class="tag" style="margin-bottom:16px;">BUTTONS</div>
  <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
    <button style="font-family:'Barlow',sans-serif; font-weight:400; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.6); border:1px solid rgba(255,255,255,0.15); padding:12px 24px; background:transparent; cursor:crosshair;">GHOST / DEFAULT</button>
    <button style="font-family:'Barlow',sans-serif; font-weight:400; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#fff; border:1px solid rgba(255,255,255,0.4); padding:12px 24px; background:transparent; cursor:crosshair;">GHOST / HOVER</button>
    <button style="font-family:'Barlow',sans-serif; font-weight:500; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#000; border:1px solid #fff; padding:12px 24px; background:#fff; cursor:crosshair;">SOLID</button>
    <a style="font-family:'Barlow',sans-serif; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.55); border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:2px;">LINK CTA →</a>
  </div>
</div>
</body></html>
