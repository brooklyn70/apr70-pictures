/* ============================================================
   APR 70 PICTURES — COLORS & TYPE
   Bold. Mature. In your face.
   Italian Modernist / Vignelli-Munari lineage. Film sprocket DNA.
   ============================================================ */

/* ---------- WEBFONTS ---------- */
@font-face {
  font-family: 'Futura Std';
  src: url('fonts/FuturaStd-Light.otf') format('opentype');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Futura Std';
  src: url('fonts/FuturaStd-Book.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Futura Std';
  src: url('fonts/FuturaStd-Medium.otf') format('opentype');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Futura Std';
  src: url('fonts/FuturaStd-Bold.otf') format('opentype');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Futura Std';
  src: url('fonts/FuturaStd-BoldOblique.otf') format('opentype');
  font-weight: 700;
  font-style: italic;
  font-display: swap;
}
@font-face {
  font-family: 'Futura Std';
  src: url('fonts/FuturaStd-Heavy.otf') format('opentype');
  font-weight: 900;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Futura Std Condensed';
  src: url('fonts/FuturaStd-CondensedBold.otf') format('opentype');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Futura Std Condensed';
  src: url('fonts/FuturaStd-CondensedExtraBd.otf') format('opentype');
  font-weight: 900;
  font-style: normal;
  font-display: swap;
}

/* Barlow via Google Fonts (body) — production site uses this */
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');

/* ---------- ROOT TOKENS ---------- */
:root {
  /* BRAND COLORS — locked per CLAUDE.md production system */
  --apr-black:      #000000;  /* primary background */
  --apr-white:      #ffffff;  /* primary foreground */
  --apr-amber:      #824B07;  /* (212) Pictures — Brooklyn rust */
  --apr-teal:       #077082;  /* (310) Pictures — LA deep teal */
  --apr-orange:     #E85D04;  /* accent / investor / sprocket warmth */
  --apr-blue:       #0077B6;  /* navy accent / sprocket cool */
  --apr-offwhite:   #c8c8c8;  /* NRC / secondary text */
  --apr-steenbeck:  #d8cdb8;  /* warm parchment / light-mode accent */
  --apr-parchment:  #ede8de;  /* light-mode background */
  --apr-ink:        #1c1208;  /* light-mode foreground */

  /* NEUTRAL RAMP (dark mode) */
  --fg-1:   #ffffff;           /* primary text */
  --fg-2:   rgba(255,255,255,0.80);
  --fg-3:   rgba(255,255,255,0.55);
  --fg-4:   rgba(255,255,255,0.35);
  --fg-5:   rgba(255,255,255,0.20);
  --fg-6:   rgba(255,255,255,0.10);
  --bg-0:   #000000;
  --bg-1:   #0a0a0a;
  --bg-2:   #111111;
  --bg-3:   #1a1a1a;
  --rule:   rgba(255,255,255,0.08);
  --rule-strong: rgba(255,255,255,0.20);
  --muted:  #888888;

  /* TYPE FAMILIES */
  --font-display:   'Futura Std', Futura, 'Trebuchet MS', Impact, 'Arial Black', sans-serif;
  --font-condensed: 'Futura Std Condensed', 'Futura Std', 'Arial Narrow', sans-serif;
  --font-body:      'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-mono:      'Share Tech Mono', 'Courier New', ui-monospace, monospace;

  /* TYPE SCALE — cinema/editorial rhythm */
  --type-hero:      clamp(3.5rem, 15vw, 18rem);    /* SLATE-sized display */
  --type-h1:        clamp(2.5rem, 9vw, 8rem);      /* Hero headline */
  --type-h2:        clamp(2rem, 8vw, 4.5rem);      /* Section heading */
  --type-h3:        clamp(1.5rem, 4vw, 3rem);
  --type-h4:        clamp(1.125rem, 2vw, 1.75rem);
  --type-body-lg:   clamp(1rem, 1.4vw, 1.25rem);
  --type-body:      1rem;
  --type-small:     0.875rem;
  --type-caption:   0.75rem;
  --type-micro:     0.625rem;   /* 10px — eyebrow labels */
  --type-tiny:      0.5625rem;  /* 9px — footer / strip labels */

  /* TRACKING — signature wide letterspacing on all-caps */
  --track-tight:    -0.02em;
  --track-normal:   0;
  --track-wide:     0.1em;
  --track-wider:    0.2em;
  --track-widest:   0.3em;
  --track-eyebrow:  0.4em;      /* micro-label signature */
  --track-strip:    0.55em;     /* filmstrip keycode */

  /* LINE HEIGHTS */
  --leading-crush:  0.85;       /* giant display, no breathing room */
  --leading-tight:  1.0;
  --leading-snug:   1.15;
  --leading-body:   1.7;
  --leading-loose:  1.8;

  /* SPACING — 8px grid */
  --s-1:  4px;
  --s-2:  8px;
  --s-3:  12px;
  --s-4:  16px;
  --s-5:  24px;
  --s-6:  32px;
  --s-7:  48px;
  --s-8:  64px;
  --s-9:  96px;
  --s-10: 128px;
  --s-11: 192px;

  /* RADII — minimal; system is mostly hard-edged */
  --r-none: 0;
  --r-xs:   2px;
  --r-sm:   4px;
  --r-hole: 2px;                /* sprocket perforation corner */

  /* BORDERS */
  --b-hair: 1px solid var(--rule);
  --b-rule: 1px solid var(--rule-strong);

  /* MOTION */
  --ease-out:  cubic-bezier(0.16, 1, 0.3, 1);     /* signature "film advance" */
  --ease-in:   cubic-bezier(0.4, 0, 0.2, 1);
  --dur-quick: 0.25s;
  --dur-base:  0.35s;
  --dur-slow:  0.55s;
  --dur-reel:  0.7s;
  --dur-epic:  1s;

  /* LAYOUT CONSTANTS */
  --filmstrip-h: 32px;
  --nav-h:       62px;
  --pad-x:       clamp(1.5rem, 5vw, 4rem);
  --max-content: 1200px;
}

/* ---------- DIVISION TOKENS ---------- */
:root {
  --div-212-color:  var(--apr-amber);
  --div-212-label:  "(212) PICTURES";
  --div-310-color:  var(--apr-teal);
  --div-310-label:  "(310) PICTURES";
  --div-nrc-color:  var(--apr-offwhite);
  --div-nrc-label:  "NEW RENAISSANCE CINEMA";
}

/* ============================================================
   SEMANTIC RESETS & ELEMENT STYLES
   ============================================================ */
html {
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background: var(--bg-0);
  color: var(--fg-1);
  font-family: var(--font-body);
  font-weight: 300;
  font-size: var(--type-body);
  line-height: var(--leading-body);
  cursor: crosshair;  /* signature APR 70 cursor */
}

/* ---------- DISPLAY TYPE ---------- */
h1, .h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--type-h1);
  line-height: var(--leading-tight);
  letter-spacing: var(--track-tight);
  text-transform: uppercase;
}

h2, .h2 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--type-h2);
  line-height: var(--leading-snug);
  letter-spacing: var(--track-tight);
  text-transform: uppercase;
}

h3, .h3 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--type-h3);
  line-height: var(--leading-snug);
  letter-spacing: var(--track-tight);
  text-transform: uppercase;
}

h4, .h4 {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--type-h4);
  letter-spacing: var(--track-wide);
  text-transform: uppercase;
}

/* Massive page-anchor display — "SLATE", "CRAFT OF CONSTRAINT" */
.display-mega {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--type-hero);
  line-height: var(--leading-crush);
  letter-spacing: var(--track-tight);
  text-transform: uppercase;
}

.display-outlined {
  color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,0.8);
}

/* ---------- BODY TYPE ---------- */
p, .body {
  font-family: var(--font-body);
  font-weight: 300;
  font-size: var(--type-body);
  line-height: var(--leading-body);
  color: var(--fg-2);
}

.body-lg {
  font-size: var(--type-body-lg);
  line-height: var(--leading-loose);
  color: var(--fg-3);
}

.body-small {
  font-size: var(--type-small);
  color: var(--fg-3);
}

/* ---------- LABEL / EYEBROW / META ---------- */
.eyebrow {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--type-micro);
  letter-spacing: var(--track-eyebrow);
  text-transform: uppercase;
  color: var(--fg-4);
}

.keycode {
  font-family: var(--font-mono);
  font-size: var(--type-tiny);
  letter-spacing: var(--track-strip);
  text-transform: uppercase;
  color: var(--fg-5);
}

.counter {
  font-family: var(--font-body);
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  letter-spacing: var(--track-wide);
}

/* ---------- LINKS ---------- */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--dur-base) var(--ease-in),
              opacity var(--dur-base) var(--ease-in);
}

a:hover { color: var(--fg-1); }

/* Signature CTA — under-bar, tight-tracked, tiny caps */
.link-cta {
  font-family: var(--font-body);
  font-size: var(--type-caption);
  letter-spacing: var(--track-wider);
  text-transform: uppercase;
  color: var(--fg-3);
  border-bottom: 1px solid var(--rule);
  padding-bottom: 2px;
  transition: color var(--dur-base), border-color var(--dur-base);
}
.link-cta:hover {
  color: var(--fg-1);
  border-color: var(--rule-strong);
}

/* ---------- BUTTONS ---------- */
.btn-ghost {
  display: inline-block;
  font-family: var(--font-body);
  font-weight: 400;
  font-size: var(--type-caption);
  letter-spacing: var(--track-wider);
  text-transform: uppercase;
  color: var(--fg-4);
  border: 1px solid var(--rule);
  padding: 12px 24px;
  background: transparent;
  cursor: pointer;
  transition: color var(--dur-base), border-color var(--dur-base);
}
.btn-ghost:hover {
  color: var(--fg-1);
  border-color: var(--rule-strong);
}

.btn-solid {
  display: inline-block;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--type-caption);
  letter-spacing: var(--track-wider);
  text-transform: uppercase;
  color: var(--apr-black);
  background: var(--apr-white);
  border: 1px solid var(--apr-white);
  padding: 12px 24px;
  cursor: pointer;
  transition: background var(--dur-base), color var(--dur-base);
}
.btn-solid:hover {
  background: transparent;
  color: var(--apr-white);
}

/* ---------- SELECTION ---------- */
::selection {
  background: var(--apr-amber);
  color: var(--apr-white);
}

/* ---------- DIVIDERS ---------- */
.rule {
  height: 1px;
  background: var(--rule);
  border: 0;
}

/* ============================================================
   SIGNATURE MOTIFS — film sprockets, filmstrip rails
   ============================================================ */
.sprocket {
  width: 13px;
  height: 9px;
  border: 1.5px solid #1e1e1e;
  border-radius: var(--r-hole);
  flex-shrink: 0;
}

.strip-rail {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 14px;
  height: var(--filmstrip-h);
  background: #050505;
  border-bottom: 1px solid var(--bg-3);
  overflow: hidden;
}

/* ============================================================
   LIGHT MODE — warm parchment / production document
   Opt-in via `body.light`
   ============================================================ */
body.light {
  background: var(--apr-parchment);
  color: var(--apr-ink);
  --fg-1: var(--apr-ink);
  --fg-2: rgba(28,18,8,0.80);
  --fg-3: rgba(28,18,8,0.55);
  --fg-4: rgba(28,18,8,0.40);
  --fg-5: rgba(28,18,8,0.25);
  --fg-6: rgba(28,18,8,0.12);
  --rule: rgba(100,80,55,0.12);
  --rule-strong: rgba(100,80,55,0.28);
}
body.light ::selection {
  background: var(--apr-amber);
  color: var(--apr-parchment);
}

/* ============================================================
   UTILITIES
   ============================================================ */
.container {
  max-width: var(--max-content);
  margin: 0 auto;
  padding: 0 var(--pad-x);
}

.uppercase { text-transform: uppercase; }
.track-eyebrow { letter-spacing: var(--track-eyebrow); }
.track-wider   { letter-spacing: var(--track-wider); }
.track-widest  { letter-spacing: var(--track-widest); }

.text-212 { color: var(--apr-amber); }
.text-310 { color: var(--apr-teal); }
.text-nrc { color: var(--apr-offwhite); }
.text-orange { color: var(--apr-orange); }

.bg-212 { background: var(--apr-amber); }
.bg-310 { background: var(--apr-teal); }
.bg-orange { background: var(--apr-orange); }

/* ============================================================
   APR 70 PICTURES — WEBSITE v2
   "The Trade" — 1930s–50s Hollywood magazine architecture
   rendered in the locked APR 70 modernist system.
   No grain. No texture. Hard edges. The rail is the texture.
   Tokens linked in <head> before this file.
   ============================================================ */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg-0);
  color: var(--fg-1);
  font-family: var(--font-body);
  font-weight: 300;
  cursor: crosshair;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a, button { cursor: crosshair; }
img { display: block; max-width: 100%; }

/* Condensed display alias — the trade-mag headline voice */
.cond {
  font-family: var(--font-condensed);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
.mono { font-family: var(--font-mono); }

/* ============================================================
   PARCHMENT "DOCUMENT" MODE
   body.light is defined in tokens; extend surfaces here.
   ============================================================ */
body.light { background: var(--apr-parchment); color: var(--apr-ink); }
body.light .filmstrip { background: #e2dccd; border-bottom-color: rgba(100,80,55,0.22); }
body.light .sprocket-hole { border-color: rgba(100,80,55,0.45); }
body.light .filmstrip-keycode { color: rgba(100,80,55,0.5); }
body.light .nameplate { background: linear-gradient(to bottom, var(--apr-parchment) 62%, transparent); }
body.light .project-card,
body.light .news-card,
body.light .doc-panel { background: #f3efe6; }
body.light .ad-cell { background: #e7e1d3; }

/* ============================================================
   FILMSTRIP RAIL
   ============================================================ */
.filmstrip {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--filmstrip-h);
  background: #050505;
  border-bottom: 1px solid #1a1a1a;
  z-index: 300; overflow: hidden;
}
.filmstrip-accent { position: absolute; top: 0; bottom: 0; left: 0; width: 4px; }
.filmstrip-holes { position: absolute; inset: 0; display: flex; align-items: center; gap: 16px; padding: 0 14px; }
.sprocket-hole { width: 13px; height: 9px; border: 1.5px solid #1e1e1e; border-radius: 2px; flex-shrink: 0; }
.filmstrip-keycode {
  position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.42em;
  color: #242424; text-transform: uppercase; white-space: nowrap;
}

/* ============================================================
   NAMEPLATE NAV  (publication header bar)
   ============================================================ */
.nameplate {
  position: fixed; top: var(--filmstrip-h); left: 0; right: 0;
  z-index: 200;
  background: linear-gradient(to bottom, rgba(0,0,0,0.98) 62%, transparent);
  padding: 0 var(--pad-x);
}
.nameplate-bar {
  display: flex; align-items: center; justify-content: space-between;
  height: var(--nav-h);
  max-width: var(--max-content); margin: 0 auto;
}
.nameplate-logo img { height: 26px; display: block; }
.nameplate-logo .light-only { display: none; }
body.light .nameplate-logo .dark-only { display: none; }
body.light .nameplate-logo .light-only { display: block; }

.nameplate-issue {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.3em;
  color: var(--fg-4); text-transform: uppercase; text-align: right; line-height: 1.5;
}
.toc-toggle {
  display: none;
  background: transparent; border: 1px solid var(--rule-strong);
  color: var(--fg-2); font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.3em; text-transform: uppercase; padding: 8px 14px;
}

/* Contents / chapter index strip beneath the nameplate */
.toc-strip {
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  background: rgba(0,0,0,0.92);
}
body.light .toc-strip { background: rgba(237,232,222,0.94); }
.toc-inner {
  display: flex; align-items: stretch; max-width: var(--max-content);
  margin: 0 auto; overflow-x: auto; scrollbar-width: none;
}
.toc-inner::-webkit-scrollbar { display: none; }
.toc-item {
  display: flex; align-items: baseline; gap: 8px;
  padding: 10px 20px; white-space: nowrap;
  border-right: 1px solid var(--rule);
  transition: background var(--dur-base) var(--ease-in), color var(--dur-base);
}
.toc-item:first-child { border-left: 1px solid var(--rule); }
.toc-item .toc-num { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em; color: var(--fg-4); }
.toc-item .toc-label { font-family: var(--font-body); font-weight: 500; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-3); }
.toc-item:hover { background: rgba(255,255,255,0.04); }
body.light .toc-item:hover { background: rgba(100,80,55,0.06); }
.toc-item:hover .toc-label { color: var(--fg-1); }
.toc-item.is-active { box-shadow: inset 0 -3px 0 var(--accent, var(--apr-orange)); }
.toc-item.is-active .toc-num { color: var(--accent, var(--apr-orange)); }
.toc-item.is-active .toc-label { color: var(--fg-1); font-weight: 600; }

/* Mobile drawer */
@media (max-width: 880px) {
  .toc-strip { display: none; }
  .toc-strip.is-open { display: block; position: fixed; top: calc(var(--filmstrip-h) + var(--nav-h)); left: 0; right: 0; z-index: 190; }
  .toc-strip.is-open .toc-inner { flex-direction: column; }
  .toc-strip.is-open .toc-item { border-right: 0; border-left: 0; border-bottom: 1px solid var(--rule); }
  .toc-toggle { display: block; }
}

/* ============================================================
   PAGE SHELL  +  shared editorial primitives
   ============================================================ */
.page { padding-top: calc(var(--filmstrip-h) + var(--nav-h) + 41px); min-height: 100vh; }
.wrap { max-width: var(--max-content); margin: 0 auto; padding: 0 var(--pad-x); }
.wrap-wide { max-width: 1440px; margin: 0 auto; padding: 0 var(--pad-x); }

/* Folio / page-number style metadata */
.folio {
  display: flex; align-items: center; gap: 14px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.32em;
  text-transform: uppercase; color: var(--fg-4);
}
.folio .folio-line { flex: 1; height: 1px; background: var(--rule); }

/* Section masthead (page title block) */
.page-masthead { padding: 56px 0 36px; border-bottom: 2px solid var(--fg-1); }
.page-masthead .kicker {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.5em;
  text-transform: uppercase; color: var(--accent, var(--apr-orange)); margin-bottom: 22px;
}
.page-masthead h1 {
  font-family: var(--font-condensed); font-weight: 900; text-transform: uppercase;
  font-size: clamp(3.5rem, 12vw, 11rem); line-height: 0.82; letter-spacing: -0.02em; margin: 0;
}
.page-masthead .standfirst {
  font-family: var(--font-body); font-weight: 300; font-size: clamp(1.05rem, 1.8vw, 1.5rem);
  line-height: 1.5; color: var(--fg-2); max-width: 720px; margin: 28px 0 0;
}

/* Dateline lead-in (NEW YORK — APR 2026 —) */
.dateline {
  font-family: var(--font-mono); font-weight: 400; font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent, var(--apr-orange));
}
.byline {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--fg-4);
}

/* Editorial column text with drop cap */
.editorial { font-family: var(--font-body); font-weight: 300; color: var(--fg-2); line-height: 1.75; }
.editorial p { margin: 0 0 1.1em; text-wrap: pretty; }
.editorial.cols-2 { columns: 2; column-gap: 48px; column-rule: 1px solid var(--rule); }
.editorial.cols-3 { columns: 3; column-gap: 40px; column-rule: 1px solid var(--rule); }
.editorial.justify p { text-align: justify; hyphens: auto; }
.dropcap::first-letter {
  font-family: var(--font-condensed); font-weight: 900;
  float: left; font-size: 4.6em; line-height: 0.72; padding: 6px 12px 0 0;
  color: var(--fg-1);
}
@media (max-width: 880px) {
  .editorial.cols-2, .editorial.cols-3 { columns: 1; }
}

/* Pull quote */
.pullquote {
  font-family: var(--font-condensed); font-weight: 700; text-transform: uppercase;
  font-size: clamp(1.6rem, 3.4vw, 3rem); line-height: 0.98; letter-spacing: -0.01em;
  color: var(--fg-1); border-top: 2px solid var(--accent, var(--apr-orange));
  border-bottom: 1px solid var(--rule); padding: 24px 0; margin: 8px 0;
}

/* Buttons */
.btn-solid {
  display: inline-block; font-family: var(--font-body); font-weight: 500;
  font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
  color: #000; background: #fff; border: 1px solid #fff; padding: 14px 28px;
  transition: background var(--dur-base), color var(--dur-base);
}
.btn-solid:hover { background: transparent; color: #fff; }
body.light .btn-solid { color: var(--apr-parchment); background: var(--apr-ink); border-color: var(--apr-ink); }
body.light .btn-solid:hover { background: transparent; color: var(--apr-ink); }
.btn-ghost {
  display: inline-block; font-family: var(--font-body); font-weight: 400;
  font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--fg-3); background: transparent; border: 1px solid var(--rule-strong);
  padding: 14px 28px; transition: color var(--dur-base), border-color var(--dur-base);
}
.btn-ghost:hover { color: var(--fg-1); border-color: var(--fg-2); }

/* Image slot skinning */
image-slot {
  --slot-bg: #0a0a0a;
  background: #0a0a0a;
}
body.light image-slot { background: #e7e1d3; }
.slot-cap {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.3em;
  text-transform: uppercase; color: var(--fg-4); margin-top: 8px;
}

/* ============================================================
   COVER  (the magazine cover landing)
   ============================================================ */
.cover { position: relative; }
.cover-top {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 24px; padding: 18px 0 14px; border-bottom: 1px solid var(--rule); flex-wrap: wrap;
}
.cover-top .ct-meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--fg-4); }
.cover-top .ct-price { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent, var(--apr-orange)); }

.cover-masthead {
  text-align: center; padding: 22px 0 8px;
  border-bottom: 3px solid var(--fg-1);
}
.cover-masthead .mh-line {
  font-family: var(--font-condensed); font-weight: 900; text-transform: uppercase;
  font-size: clamp(4.5rem, 22vw, 20rem); line-height: 0.8; letter-spacing: -0.03em; margin: 0;
  color: var(--fg-1);
}
.cover-masthead .mh-sub {
  display: flex; align-items: center; justify-content: center; gap: 18px;
  margin-top: 14px; flex-wrap: wrap;
}
.cover-masthead .mh-sub span {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.4em;
  text-transform: uppercase; color: var(--fg-3);
}
.cover-masthead .mh-sub .dot { color: var(--accent, var(--apr-orange)); }

/* Cover body: dominant image + cover lines */
.cover-body {
  display: grid; grid-template-columns: 1.55fr 1fr; gap: 0;
  border-bottom: 2px solid var(--fg-1);
}
.cover-feature { position: relative; border-right: 2px solid var(--fg-1); }
.cover-feature image-slot { width: 100%; height: 100%; min-height: 540px; }
.cover-feature .feat-overlay {
  position: absolute; left: 0; bottom: 0; right: 0;
  padding: 40px var(--s-7) 32px;
  background: linear-gradient(to top, rgba(0,0,0,0.92) 12%, rgba(0,0,0,0.4) 60%, transparent);
  pointer-events: none;
}
.cover-feature .feat-kicker {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.42em;
  text-transform: uppercase; color: var(--apr-orange); margin-bottom: 14px;
}
.cover-feature .feat-title {
  font-family: var(--font-condensed); font-weight: 900; text-transform: uppercase;
  font-size: clamp(2.2rem, 4.6vw, 4.4rem); line-height: 0.9; letter-spacing: -0.015em;
  color: #fff; margin: 0 0 14px; max-width: 16ch;
}
.cover-feature .feat-deck {
  font-family: var(--font-body); font-weight: 300; font-size: 15px; line-height: 1.55;
  color: rgba(255,255,255,0.78); max-width: 52ch;
}

.cover-lines { display: flex; flex-direction: column; }
.coverline {
  display: block; padding: 24px var(--s-7); border-bottom: 1px solid var(--rule);
  text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0;
  width: 100%; transition: background var(--dur-base) var(--ease-in);
}
.coverline:last-child { border-bottom: 0; }
.coverline:hover { background: rgba(255,255,255,0.04); }
body.light .coverline:hover { background: rgba(100,80,55,0.06); }
.coverline .cl-kicker {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--fg-4);
}
.coverline .cl-dot { width: 7px; height: 7px; border-radius: 50%; }
.coverline .cl-title {
  font-family: var(--font-condensed); font-weight: 700; text-transform: uppercase;
  font-size: clamp(1.4rem, 2.3vw, 2rem); line-height: 0.95; letter-spacing: -0.01em;
  color: var(--fg-1); margin: 0 0 8px;
}
.coverline .cl-sub { font-family: var(--font-body); font-weight: 300; font-size: 13px; line-height: 1.5; color: var(--fg-3); }

/* Cover footer ticker / contents row */
.cover-contents {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-bottom: 2px solid var(--fg-1);
}
.cc-cell { padding: 22px var(--s-5); border-right: 1px solid var(--rule); }
.cc-cell:last-child { border-right: 0; }
.cc-cell .cc-num { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.25em; color: var(--accent, var(--apr-orange)); }
.cc-cell .cc-label { font-family: var(--font-body); font-weight: 600; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-1); margin: 10px 0 6px; }
.cc-cell .cc-desc { font-family: var(--font-body); font-weight: 300; font-size: 12px; line-height: 1.5; color: var(--fg-3); }

@media (max-width: 880px) {
  .cover-body { grid-template-columns: 1fr; }
  .cover-feature { border-right: 0; border-bottom: 2px solid var(--fg-1); }
  .cover-feature image-slot { min-height: 380px; }
  .cover-contents { grid-template-columns: 1fr 1fr; }
}

/* ============================================================
   DIVISION ROWS  (carried from v1, magazine-tuned)
   ============================================================ */
.division-row { position: relative; padding: 72px var(--pad-x); overflow: hidden; min-height: 380px; display: flex; transition: filter var(--dur-slow); }
.division-row:hover { filter: brightness(1.07); }
.division-ghost {
  position: absolute; right: -3vw; bottom: -7vw;
  font-family: var(--font-condensed); font-weight: 900; font-size: clamp(18rem, 34vw, 40rem);
  line-height: 0.8; letter-spacing: -0.06em; pointer-events: none; user-select: none;
}
.division-inner { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; max-width: var(--max-content); width: 100%; margin: 0 auto; gap: 40px; }
.division-top { display: flex; align-items: baseline; gap: 18px; }
.division-num { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.3em; opacity: 0.7; }
.division-kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase; opacity: 0.6; }
.division-title { font-family: var(--font-condensed); font-weight: 900; font-size: clamp(2.6rem, 6.5vw, 5.5rem); line-height: 0.92; letter-spacing: -0.02em; text-transform: uppercase; margin: 0 0 14px; }
.division-sub { font-family: var(--font-body); font-weight: 300; font-size: clamp(1rem, 1.4vw, 1.2rem); line-height: 1.6; max-width: 560px; opacity: 0.88; }
.division-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.25); flex-wrap: wrap; }
.division-projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 32px; }
.division-project { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; padding: 5px 0; border-bottom: 1px dashed rgba(255,255,255,0.18); }
.division-project-meta { opacity: 0.6; }
.division-cta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; white-space: nowrap; }
@media (max-width: 720px) { .division-bottom { flex-direction: column; align-items: flex-start; } }

/* ============================================================
   SLATE GRID
   ============================================================ */
.slate-filters { display: flex; gap: 18px; flex-wrap: wrap; margin: 36px 0 48px; padding-top: 22px; border-top: 1px solid var(--rule); }
.slate-filter { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--fg-4); background: transparent; border: 0; padding: 6px 0; border-bottom: 1px solid transparent; transition: color var(--dur-base), border-color var(--dur-base); }
.slate-filter:hover { color: var(--fg-2); }
.slate-filter.is-active { color: var(--fg-1); border-bottom-color: var(--accent, var(--apr-orange)); }
.slate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 28px; padding-bottom: 80px; }

.project-card { display: flex; flex-direction: column; background: var(--bg-1); border: 1px solid var(--rule); padding: 18px; transition: border-color var(--dur-base); }
.project-card:hover { border-color: var(--rule-strong); }
.project-card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.project-card-div { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.3em; }
.project-card-idx { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--fg-4); }
.project-card image-slot { width: 100%; aspect-ratio: 16/10; margin-bottom: 18px; }
.project-card-title { font-family: var(--font-condensed); font-weight: 900; font-size: 26px; line-height: 0.92; letter-spacing: -0.01em; text-transform: uppercase; margin: 0 0 12px; color: var(--fg-1); }
.project-card-desc { font-family: var(--font-body); font-weight: 300; font-size: 13px; line-height: 1.6; color: var(--fg-3); margin: 0 0 18px; flex: 1; }
.project-card-foot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; border-top: 1px solid var(--rule); }
.project-card-meta { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.3em; color: var(--fg-4); text-transform: uppercase; }
.project-card-link { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.3em; color: var(--fg-2); border-bottom: 1px solid var(--rule-strong); padding-bottom: 2px; }

/* ============================================================
   NEWS  (the heart of the magazine)
   ============================================================ */
.news-lead { display: grid; grid-template-columns: 1.4fr 1fr; gap: 0; border-bottom: 2px solid var(--fg-1); margin-bottom: 0; }
.news-lead-art { position: relative; border-right: 2px solid var(--fg-1); }
.news-lead-art image-slot { width: 100%; height: 100%; min-height: 460px; }
.news-lead-art .tag { position: absolute; top: 0; left: 0; background: var(--accent, var(--apr-orange)); color: #fff; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; padding: 8px 16px; }
.news-lead-body { padding: 40px var(--s-7); display: flex; flex-direction: column; justify-content: center; }
.news-lead-body .nl-kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--accent, var(--apr-orange)); margin-bottom: 18px; }
.news-lead-body h2 { font-family: var(--font-condensed); font-weight: 900; font-size: clamp(2.2rem, 4vw, 3.6rem); line-height: 0.9; letter-spacing: -0.015em; text-transform: uppercase; margin: 0 0 18px; }
.news-lead-body .nl-deck { font-family: var(--font-body); font-weight: 300; font-size: 16px; line-height: 1.6; color: var(--fg-2); margin: 0 0 22px; }
.news-lead-body .nl-foot { display: flex; gap: 18px; align-items: baseline; }

.news-bar { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid var(--rule); margin-top: 56px; }
.news-bar .nb-title { font-family: var(--font-body); font-weight: 600; font-size: 12px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--fg-1); }
.news-bar .nb-meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.25em; color: var(--fg-4); text-transform: uppercase; }

.news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-bottom: 1px solid var(--rule); }
.news-card { padding: 28px 28px 32px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); transition: background var(--dur-base) var(--ease-in); }
.news-card:hover { background: rgba(255,255,255,0.03); }
body.light .news-card:hover { background: rgba(100,80,55,0.05); }
.news-card .nc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.news-card .nc-dot { width: 7px; height: 7px; border-radius: 50%; }
.news-card .nc-cat { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--fg-4); }
.news-card .nc-date { margin-left: auto; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em; color: var(--fg-5); }
.news-card h3 { font-family: var(--font-condensed); font-weight: 700; font-size: 22px; line-height: 0.96; letter-spacing: -0.005em; text-transform: uppercase; margin: 0 0 12px; color: var(--fg-1); }
.news-card p { font-family: var(--font-body); font-weight: 300; font-size: 13px; line-height: 1.6; color: var(--fg-3); margin: 0; }
.news-card .nc-read { display: inline-block; margin-top: 16px; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--fg-2); border-bottom: 1px solid var(--rule-strong); padding-bottom: 2px; }
@media (max-width: 980px) { .news-grid { grid-template-columns: 1fr 1fr; } .news-lead { grid-template-columns: 1fr; } .news-lead-art { border-right: 0; border-bottom: 2px solid var(--fg-1); } .news-lead-art image-slot { min-height: 320px; } }
@media (max-width: 640px) { .news-grid { grid-template-columns: 1fr; } }

/* Column-style founder note */
.column-note { display: grid; grid-template-columns: 220px 1fr; gap: 48px; padding: 56px 0; border-top: 2px solid var(--fg-1); }
.column-note .cn-side { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--fg-4); line-height: 1.9; }
@media (max-width: 880px) { .column-note { grid-template-columns: 1fr; gap: 24px; } }

/* ============================================================
   DOCUMENT PANELS  (Investors)
   ============================================================ */
.doc-panel { border: 1px solid var(--rule); background: var(--bg-1); padding: 40px; }
.doc-table { width: 100%; border-collapse: collapse; }
.doc-table th { text-align: left; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--fg-4); padding: 12px 16px; border-bottom: 1px solid var(--rule-strong); }
.doc-table td { font-family: var(--font-body); font-weight: 300; font-size: 14px; color: var(--fg-2); padding: 16px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.doc-table .dt-proj { font-family: var(--font-condensed); font-weight: 700; text-transform: uppercase; font-size: 17px; letter-spacing: 0; color: var(--fg-1); }
.doc-table .dt-budget { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.05em; color: var(--accent, var(--apr-orange)); white-space: nowrap; }
.doc-table tr:hover td { background: rgba(255,255,255,0.02); }
body.light .doc-table tr:hover td { background: rgba(100,80,55,0.04); }

.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid var(--fg-1); border-bottom: 1px solid var(--rule); }
.stat-cell { padding: 28px var(--s-5); border-right: 1px solid var(--rule); }
.stat-cell:last-child { border-right: 0; }
.stat-cell .sv { font-family: var(--font-condensed); font-weight: 900; font-size: clamp(2.2rem, 4vw, 3.4rem); line-height: 0.9; letter-spacing: -0.01em; color: var(--fg-1); }
.stat-cell .sl { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--fg-4); margin-top: 10px; }
@media (max-width: 880px) { .stat-row { grid-template-columns: 1fr 1fr; } .stat-cell:nth-child(2) { border-right: 0; } }

.timeline-row { display: flex; align-items: baseline; gap: 24px; padding: 20px 0; border-bottom: 1px solid var(--rule); }
.timeline-row .tl-date { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.2em; color: var(--accent, var(--apr-orange)); min-width: 130px; text-transform: uppercase; }
.timeline-row .tl-event { font-family: var(--font-body); font-weight: 300; font-size: 15px; color: var(--fg-2); }
.timeline-row .tl-event strong { font-weight: 600; color: var(--fg-1); }

/* ============================================================
   CAREERS  (classified-ad density)
   ============================================================ */
.ad-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--fg-1); border-left: 1px solid var(--rule); }
.ad-cell { padding: 26px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: transparent; display: flex; flex-direction: column; transition: background var(--dur-base) var(--ease-in); }
.ad-cell:hover { background: rgba(255,255,255,0.03); }
body.light .ad-cell:hover { background: rgba(100,80,55,0.05); }
.ad-cell .ad-no { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.3em; color: var(--fg-5); margin-bottom: 14px; }
.ad-cell .ad-title { font-family: var(--font-condensed); font-weight: 700; font-size: 20px; line-height: 0.96; text-transform: uppercase; color: var(--fg-1); margin: 0 0 8px; }
.ad-cell .ad-meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent, var(--apr-orange)); margin-bottom: 14px; }
.ad-cell .ad-body { font-family: var(--font-body); font-weight: 300; font-size: 13px; line-height: 1.6; color: var(--fg-3); flex: 1; margin: 0 0 16px; }
.ad-cell .ad-apply { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--fg-2); border-bottom: 1px solid var(--rule-strong); padding-bottom: 2px; align-self: flex-start; }
@media (max-width: 980px) { .ad-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) { .ad-grid { grid-template-columns: 1fr; } }

/* ============================================================
   CONTACT
   ============================================================ */
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--fg-1); }
.contact-tile { padding: 44px; position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 280px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); transition: filter var(--dur-base); }
.contact-tile.has-fill:hover { filter: brightness(1.1); }
.contact-tile .ct-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; opacity: 0.7; }
.contact-tile .ct-title { font-family: var(--font-condensed); font-weight: 900; font-size: clamp(2rem, 4vw, 3.2rem); line-height: 0.92; text-transform: uppercase; margin-top: auto; }
.contact-tile .ct-body { font-family: var(--font-body); font-weight: 300; font-size: 14px; line-height: 1.7; white-space: pre-line; margin-top: 16px; opacity: 0.9; }
.contact-tile .ct-corner { position: absolute; top: 18px; right: 22px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.3em; opacity: 0.6; }
@media (max-width: 720px) { .contact-grid { grid-template-columns: 1fr; } }

/* Contact form */
.cform { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
.cfield { display: flex; flex-direction: column; padding: 18px 0; border-bottom: 1px solid var(--rule); }
.cfield.full { grid-column: 1 / -1; }
.cfield label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--fg-4); margin-bottom: 10px; }
.cfield input, .cfield textarea, .cfield select {
  background: transparent; border: 0; color: var(--fg-1);
  font-family: var(--font-body); font-weight: 300; font-size: 16px; padding: 4px 0; outline: none; resize: vertical;
}
.cfield input::placeholder, .cfield textarea::placeholder { color: var(--fg-5); }
.cfield input:focus, .cfield textarea:focus, .cfield select:focus { color: var(--fg-1); }
.cfield.focused { border-bottom-color: var(--accent, var(--apr-orange)); }
@media (max-width: 720px) { .cform { grid-template-columns: 1fr; } }

/* ============================================================
   TAGLINE BAND
   ============================================================ */
.tagline-band { padding: 80px var(--pad-x); text-align: center; max-width: 1000px; margin: 0 auto; }
.tagline-rule { height: 1px; background: linear-gradient(to right, transparent, var(--rule-strong), transparent); }
.tagline-h { font-family: var(--font-condensed); font-weight: 900; font-size: clamp(2.5rem, 6vw, 5rem); line-height: 0.92; letter-spacing: -0.02em; text-transform: uppercase; color: var(--fg-1); margin: 40px 0 16px; }
.tagline-p { font-family: var(--font-body); font-weight: 300; font-size: 14px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--fg-3); margin: 0 0 36px; }
.tagline-ctas { display: flex; gap: 16px; justify-content: center; margin-bottom: 56px; flex-wrap: wrap; }

/* ============================================================
   FOOTER / COLOPHON
   ============================================================ */
.site-footer { padding: 72px var(--pad-x) 40px; border-top: 1px solid var(--rule); background: var(--bg-0); }
body.light .site-footer { background: var(--apr-parchment); }
.footer-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; max-width: var(--max-content); margin: 0 auto; }
.footer-col { display: flex; flex-direction: column; gap: 9px; }
.footer-title { font-family: var(--font-body); font-weight: 600; font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--fg-1); margin-bottom: 12px; }
.footer-meta { font-family: var(--font-body); font-weight: 300; font-size: 12px; letter-spacing: 0.04em; color: var(--fg-3); }
.footer-meta.mono { font-family: var(--font-mono); letter-spacing: 0.22em; font-size: 10px; }
.footer-link { font-family: var(--font-body); font-weight: 400; font-size: 12px; letter-spacing: 0.08em; color: var(--fg-2); background: none; border: 0; text-align: left; padding: 0; }
.footer-link:hover { color: var(--fg-1); }
.footer-rule { max-width: var(--max-content); margin: 40px auto 20px; height: 1px; background: var(--rule); }
.footer-baseline { display: flex; justify-content: space-between; max-width: var(--max-content); margin: 0 auto; flex-wrap: wrap; gap: 12px; }
.footer-small { font-size: 10px; letter-spacing: 0.3em; color: var(--fg-5); text-transform: uppercase; }
.footer-small.mono { font-family: var(--font-mono); color: var(--fg-4); }
@media (max-width: 880px) { .footer-row { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .footer-row { grid-template-columns: 1fr; } }

/* Corner accent */
.corner-accent { position: fixed; bottom: 0; right: 0; width: 200px; height: 3px; background: linear-gradient(to left, var(--apr-teal), transparent); opacity: 0.4; pointer-events: none; z-index: 50; }

/* Palette toggle button */
.mode-toggle { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--rule-strong); color: var(--fg-3); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; padding: 7px 12px; transition: color var(--dur-base), border-color var(--dur-base); }
.mode-toggle:hover { color: var(--fg-1); border-color: var(--fg-2); }
.mode-toggle .md-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-2); }

/* Entrance reveal — base state is VISIBLE; animate from hidden when armed */
@media (prefers-reduced-motion: no-preference) {
  .page[data-ready="1"] .fadeup { animation: aprFadeUp var(--dur-reel) var(--ease-out) both; }
  .page[data-ready="1"] .fadeup.d1 { animation-delay: 0.07s; }
  .page[data-ready="1"] .fadeup.d2 { animation-delay: 0.14s; }
  .page[data-ready="1"] .fadeup.d3 { animation-delay: 0.21s; }
  .page[data-ready="1"] .fadeup.d4 { animation-delay: 0.28s; }
}
@keyframes aprFadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}

</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)
/* BEGIN USAGE */
/**
 * <image-slot> — user-fillable image placeholder.
 *
 * Drop this into a deck, mockup, or page wherever you want the user to
 * supply an image. You control the slot's shape and size; the user fills it
 * by dragging an image file onto it (or clicking to browse). The dropped
 * image persists across reloads via a .image-slots.state.json sidecar —
 * same read-via-fetch / write-via-window.omelette pattern as
 * design_canvas.jsx, so the filled slot shows on share links, downloaded
 * zips, and PPTX export. Outside the omelette runtime the slot is read-only.
 *
 * The host bridge only allows sidecar writes at the project root, so the
 * HTML that uses this component is assumed to live at the project root too
 * (same constraint as design_canvas.jsx).
 *
 * Attributes:
 *   id           Persistence key. REQUIRED for the drop to survive reload —
 *                every slot on the page needs a distinct id.
 *   shape        'rect' | 'rounded' | 'circle' | 'pill'   (default 'rounded')
 *                'circle' applies 50% border-radius; on a non-square slot
 *                that's an ellipse — set equal width and height for a true
 *                circle.
 *   radius       Corner radius in px for 'rounded'.       (default 12)
 *   mask         Any CSS clip-path value. Overrides `shape` — use this for
 *                hexagons, blobs, arbitrary polygons.
 *   fit          object-fit: cover | contain | fill.       (default 'cover')
 *                With cover (the default) double-clicking the filled slot
 *                enters a reframe mode: the whole image spills past the mask
 *                (translucent outside, opaque inside), drag to reposition,
 *                corner-drag to scale. The crop persists alongside the image
 *                in the sidecar. contain/fill stay static.
 *   position     object-position for fit=contain|fill.     (default '50% 50%')
 *   placeholder  Empty-state caption.                      (default 'Drop an image')
 *   src          Optional initial/fallback image URL. A user drop overrides
 *                it; clearing the drop reveals src again.
 *
 * Size and layout come from ordinary CSS on the element — width/height
 * inline or from a parent grid — so it composes with any layout.
 *
 * Usage:
 *   <image-slot id="hero"   style="width:800px;height:450px" shape="rounded" radius="20"
 *               placeholder="Drop a hero image"></image-slot>
 *   <image-slot id="avatar" style="width:120px;height:120px" shape="circle"></image-slot>
 *   <image-slot id="kite"   style="width:300px;height:300px"
 *               mask="polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"></image-slot>
 */
/* END USAGE */

(() => {
  const STATE_FILE = '.image-slots.state.json';
  // 2× a ~600px slot in a 1920-wide deck — retina-sharp without making the
  // sidecar enormous. A 1200px WebP at q=0.85 is ~150-300KB.
  const MAX_DIM = 1200;
  // Raster formats only. SVG is excluded (can carry script; createImageBitmap
  // on SVG blobs is inconsistent). GIF is excluded because the canvas
  // re-encode keeps only the first frame, so an animated GIF would silently
  // go still — better to reject than surprise.
  const ACCEPT = ['image/png', 'image/jpeg', 'image/webp', 'image/avif'];

  // ── Shared sidecar store ────────────────────────────────────────────────
  // One fetch + immediate write-on-change for every <image-slot> on the
  // page. Reads via fetch() so viewing works anywhere the HTML and sidecar
  // are served together; writes go through window.omelette.writeFile, which
  // the host allowlists to *.state.json basenames only.
  const subs = new Set();
  let slots = {};
  // ids explicitly cleared before the sidecar fetch resolved — otherwise
  // the merge below can't tell "never set" from "just deleted" and would
  // resurrect the sidecar's stale value.
  const tombstones = new Set();
  let loaded = false;
  let loadP = null;

  function load() {
    if (loadP) return loadP;
    loadP = fetch(STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        // Merge: sidecar loses to any in-memory change that raced ahead of
        // the fetch (drop or clear) so neither is clobbered by hydration.
        if (j && typeof j === 'object') {
          const merged = Object.assign({}, j, slots);
          // A framing-only write that raced ahead of hydration must not
          // drop a user image that's only on disk — inherit u from the
          // sidecar for any in-memory entry that lacks one.
          for (const k in slots) {
            if (merged[k] && !merged[k].u && j[k]) {
              merged[k].u = typeof j[k] === 'string' ? j[k] : j[k].u;
            }
          }
          for (const id of tombstones) delete merged[id];
          slots = merged;
        }
        tombstones.clear();
      })
      .catch(() => {})
      .then(() => { loaded = true; subs.forEach((fn) => fn()); });
    return loadP;
  }

  // Serialize writes so two near-simultaneous drops on different slots
  // can't reorder at the backend and leave the sidecar with only the
  // first. A save requested mid-flight just marks dirty and re-fires on
  // completion with the then-current slots.
  let saving = false;
  let saveDirty = false;
  function save() {
    if (saving) { saveDirty = true; return; }
    const w = window.omelette && window.omelette.writeFile;
    if (!w) return;
    saving = true;
    Promise.resolve(w(STATE_FILE, JSON.stringify(slots)))
      .catch(() => {})
      .then(() => { saving = false; if (saveDirty) { saveDirty = false; save(); } });
  }

  const S_MAX = 5;
  const clampS = (s) => Math.max(1, Math.min(S_MAX, s));

  // Normalize a stored slot value. Pre-reframe sidecars stored a bare
  // data-URL string; newer ones store {u, s, x, y}. Either shape is valid.
  function getSlot(id) {
    const v = slots[id];
    if (!v) return null;
    return typeof v === 'string' ? { u: v, s: 1, x: 0, y: 0 } : v;
  }

  function setSlot(id, val) {
    if (!id) return;
    if (val) { slots[id] = val; tombstones.delete(id); }
    else { delete slots[id]; if (!loaded) tombstones.add(id); }
    subs.forEach((fn) => fn());
    // A drop is rare + high-value — write immediately so nav-away can't lose
    // it. Gate on the initial read so we don't overwrite a sidecar we haven't
    // merged yet; the merge in load() keeps this change once the read lands.
    if (loaded) save(); else load().then(save);
  }

  // ── Image downscale ─────────────────────────────────────────────────────
  // Encode through a canvas so the sidecar carries resized bytes, not the
  // raw upload. Longest side is capped at 2× the slot's rendered width
  // (retina) and at MAX_DIM. WebP keeps alpha and is ~10× smaller than PNG
  // for photos, so there's no need for per-image format picking.
  async function toDataUrl(file, targetW) {
    const bitmap = await createImageBitmap(file);
    try {
      const cap = Math.min(MAX_DIM, Math.max(1, Math.round(targetW * 2)) || MAX_DIM);
      const scale = Math.min(1, cap / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * scale));
      const h = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      return canvas.toDataURL('image/webp', 0.85);
    } finally {
      bitmap.close && bitmap.close();
    }
  }

  // ── Custom element ──────────────────────────────────────────────────────
  const stylesheet =
    ':host{display:inline-block;position:relative;vertical-align:top;' +
    '  font:13px/1.3 system-ui,-apple-system,sans-serif;color:rgba(0,0,0,.55);width:240px;height:160px}' +
    '.frame{position:absolute;inset:0;overflow:hidden;background:rgba(0,0,0,.04)}' +
    // .frame img (clipped) and .spill (unclipped ghost + handles) share the
    // same left/top/width/height in frame-%, computed by _applyView(), so the
    // inside-mask crop and the outside-mask spill stay pixel-aligned.
    '.frame img{position:absolute;max-width:none;transform:translate(-50%,-50%);' +
    '  -webkit-user-drag:none;user-select:none;touch-action:none}' +
    // Reframe mode (double-click): the full image spills past the mask. The
    // spill layer is sized to the IMAGE bounds so its corners are where the
    // resize handles belong. The ghost <img> inside is translucent; the real
    // clipped <img> underneath shows the opaque in-mask crop.
    '.spill{position:absolute;transform:translate(-50%,-50%);display:none;z-index:1;' +
    '  cursor:grab;touch-action:none}' +
    ':host([data-panning]) .spill{cursor:grabbing}' +
    '.spill .ghost{position:absolute;inset:0;width:100%;height:100%;opacity:.35;' +
    '  pointer-events:none;-webkit-user-drag:none;user-select:none;' +
    '  box-shadow:0 0 0 1px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.2)}' +
    '.spill .handle{position:absolute;width:12px;height:12px;border-radius:50%;' +
    '  background:#fff;box-shadow:0 0 0 1.5px #c96442,0 1px 3px rgba(0,0,0,.3);' +
    '  transform:translate(-50%,-50%)}' +
    '.spill .handle[data-c=nw]{left:0;top:0;cursor:nwse-resize}' +
    '.spill .handle[data-c=ne]{left:100%;top:0;cursor:nesw-resize}' +
    '.spill .handle[data-c=sw]{left:0;top:100%;cursor:nesw-resize}' +
    '.spill .handle[data-c=se]{left:100%;top:100%;cursor:nwse-resize}' +
    ':host([data-reframe]){z-index:10}' +
    ':host([data-reframe]) .spill{display:block}' +
    ':host([data-reframe]) .frame{box-shadow:0 0 0 2px #c96442}' +
    '.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
    '  justify-content:center;gap:6px;text-align:center;padding:12px;box-sizing:border-box;' +
    '  cursor:pointer;user-select:none}' +
    '.empty svg{opacity:.45}' +
    '.empty .cap{max-width:90%;font-weight:500;letter-spacing:.01em}' +
    '.empty .sub{font-size:11px}' +
    '.empty .sub u{text-underline-offset:2px;text-decoration-color:rgba(0,0,0,.25)}' +
    '.empty:hover .sub u{color:rgba(0,0,0,.75);text-decoration-color:currentColor}' +
    ':host([data-over]) .frame{outline:2px solid #c96442;outline-offset:-2px;' +
    '  background:rgba(201,100,66,.10)}' +
    '.ring{position:absolute;inset:0;pointer-events:none;border:1.5px dashed rgba(0,0,0,.25);' +
    '  transition:border-color .12s}' +
    ':host([data-over]) .ring{border-color:#c96442}' +
    ':host([data-filled]) .ring{display:none}' +
    // Controls sit BELOW the mask (top:100%), absolutely positioned so the
    // author-declared slot height is unaffected. The gap is padding, not a
    // top offset, so the hover target stays contiguous with the frame.
    '.ctl{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:8px;' +
    '  display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2;' +
    '  white-space:nowrap}' +
    ':host([data-filled][data-editable]:hover) .ctl,:host([data-reframe]) .ctl' +
    '  {opacity:1;pointer-events:auto}' +
    '.ctl button{appearance:none;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;' +
    '  background:rgba(0,0,0,.65);color:#fff;font:11px/1 system-ui,-apple-system,sans-serif;' +
    '  backdrop-filter:blur(6px)}' +
    '.ctl button:hover{background:rgba(0,0,0,.8)}' +
    '.err{position:absolute;left:8px;bottom:8px;right:8px;color:#b3261e;font-size:11px;' +
    '  background:rgba(255,255,255,.85);padding:4px 6px;border-radius:5px;pointer-events:none}';

  const icon =
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>' +
    '<path d="m21 15-5-5L5 21"/></svg>';

  class ImageSlot extends HTMLElement {
    static get observedAttributes() {
      return ['shape', 'radius', 'mask', 'fit', 'position', 'placeholder', 'src', 'id'];
    }

    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      // .spill and .ctl sit OUTSIDE .frame so overflow:hidden + border-radius
      // on the frame (circle, pill, rounded) can't clip them.
      root.innerHTML =
        '<style>' + stylesheet + '</style>' +
        '<div class="frame" part="frame">' +
        '  <img part="image" alt="" draggable="false" style="display:none">' +
        '  <div class="empty" part="empty">' + icon +
        '    <div class="cap"></div>' +
        '    <div class="sub">or <u>browse files</u></div></div>' +
        '  <div class="ring" part="ring"></div>' +
        '</div>' +
        '<div class="spill">' +
        '  <img class="ghost" alt="" draggable="false">' +
        '  <div class="handle" data-c="nw"></div><div class="handle" data-c="ne"></div>' +
        '  <div class="handle" data-c="sw"></div><div class="handle" data-c="se"></div>' +
        '</div>' +
        '<div class="ctl"><button data-act="replace" title="Replace image">Replace</button>' +
        '  <button data-act="clear" title="Remove image">Remove</button></div>' +
        '<input type="file" accept="' + ACCEPT.join(',') + '" hidden>';
      this._frame = root.querySelector('.frame');
      this._ring = root.querySelector('.ring');
      this._img = root.querySelector('.frame img');
      this._empty = root.querySelector('.empty');
      this._cap = root.querySelector('.cap');
      this._sub = root.querySelector('.sub');
      this._spill = root.querySelector('.spill');
      this._ghost = root.querySelector('.ghost');
      this._err = null;
      this._input = root.querySelector('input');
      this._depth = 0;
      this._gen = 0;
      this._view = { s: 1, x: 0, y: 0 };
      this._subFn = () => this._render();
      // Shadow-DOM listeners live with the shadow DOM — bound once here so
      // disconnect/reconnect (e.g. React remount) doesn't stack handlers.
      this._empty.addEventListener('click', () => this._input.click());
      root.addEventListener('click', (e) => {
        const act = e.target && e.target.getAttribute && e.target.getAttribute('data-act');
        if (act === 'replace') { this._exitReframe(true); this._input.click(); }
        if (act === 'clear') {
          this._exitReframe(false);
          this._gen++;
          this._local = null;
          if (this.id) setSlot(this.id, null); else this._render();
        }
      });
      this._input.addEventListener('change', () => {
        const f = this._input.files && this._input.files[0];
        if (f) this._ingest(f);
        this._input.value = '';
      });
      // naturalWidth/Height aren't known until load — re-apply so the cover
      // baseline is computed from real dimensions, not the 100%×100% fallback.
      this._img.addEventListener('load', () => this._applyView());
      // Gated on editable + fit=cover so share links and contain/fill slots
      // stay static.
      this.addEventListener('dblclick', (e) => {
        if (!this.hasAttribute('data-editable') || !this._reframes()) return;
        e.preventDefault();
        if (this.hasAttribute('data-reframe')) this._exitReframe(true);
        else this._enterReframe();
      });
      // Pan + resize both originate on the spill layer. A handle pointerdown
      // drives an aspect-locked resize anchored at the opposite corner; any
      // other pointerdown on the spill pans. Offsets are frame-% so a
      // reframed slot survives responsive resize / PPTX export.
      this._spill.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || !this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        e.stopPropagation();
        this._spill.setPointerCapture(e.pointerId);
        const rect = this.getBoundingClientRect();
        const fw = rect.width || 1, fh = rect.height || 1;
        const corner = e.target.getAttribute && e.target.getAttribute('data-c');
        let move;
        if (corner) {
          // Resize about the OPPOSITE corner. Viewport-px throughout (rect
          // fw/fh, not clientWidth) so the math survives a transform:scale()
          // ancestor — deck_stage renders slides scaled-to-fit.
          const iw = this._img.naturalWidth || 1, ih = this._img.naturalHeight || 1;
          const base = Math.max(fw / iw, fh / ih);
          const sx = corner.includes('e') ? 1 : -1;
          const sy = corner.includes('s') ? 1 : -1;
          const s0 = this._view.s;
          const w0 = iw * base * s0, h0 = ih * base * s0;
          const cx0 = (50 + this._view.x) / 100 * fw;
          const cy0 = (50 + this._view.y) / 100 * fh;
          const ox = cx0 - sx * w0 / 2, oy = cy0 - sy * h0 / 2;
          const diag0 = Math.hypot(w0, h0);
          const ux = sx * w0 / diag0, uy = sy * h0 / diag0;
          move = (ev) => {
            const proj = (ev.clientX - rect.left - ox) * ux +
                         (ev.clientY - rect.top - oy) * uy;
            const s = clampS(s0 * proj / diag0);
            const d = diag0 * s / s0;
            this._view.s = s;
            this._view.x = (ox + ux * d / 2) / fw * 100 - 50;
            this._view.y = (oy + uy * d / 2) / fh * 100 - 50;
            this._clampView();
            this._applyView();
          };
        } else {
          this.setAttribute('data-panning', '');
          const start = { px: e.clientX, py: e.clientY, x: this._view.x, y: this._view.y };
          move = (ev) => {
            this._view.x = start.x + (ev.clientX - start.px) / fw * 100;
            this._view.y = start.y + (ev.clientY - start.py) / fh * 100;
            this._clampView();
            this._applyView();
          };
        }
        const up = () => {
          try { this._spill.releasePointerCapture(e.pointerId); } catch {}
          this._spill.removeEventListener('pointermove', move);
          this._spill.removeEventListener('pointerup', up);
          this._spill.removeEventListener('pointercancel', up);
          this.removeAttribute('data-panning');
          this._dragUp = null;
        };
        // Stashed so _exitReframe (Escape / outside-click mid-drag) can
        // tear the capture + listeners down synchronously.
        this._dragUp = up;
        this._spill.addEventListener('pointermove', move);
        this._spill.addEventListener('pointerup', up);
        this._spill.addEventListener('pointercancel', up);
      });
      // Wheel zoom stays available inside reframe mode as a trackpad nicety —
      // zooms toward the cursor (offset' = cursor·(1-k) + offset·k).
      this.addEventListener('wheel', (e) => {
        if (!this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        const r = this.getBoundingClientRect();
        const cx = (e.clientX - r.left) / r.width * 100 - 50;
        const cy = (e.clientY - r.top) / r.height * 100 - 50;
        const prev = this._view.s;
        const next = clampS(prev * Math.pow(1.0015, -e.deltaY));
        if (next === prev) return;
        const k = next / prev;
        this._view.s = next;
        this._view.x = cx * (1 - k) + this._view.x * k;
        this._view.y = cy * (1 - k) + this._view.y * k;
        this._clampView();
        this._applyView();
      }, { passive: false });
    }

    connectedCallback() {
      // Warn once per page — an id-less slot works for the session but
      // cannot persist, and two id-less slots would share nothing.
      if (!this.id && !ImageSlot._warned) {
        ImageSlot._warned = true;
        console.warn('<image-slot> without an id will not persist its dropped image.');
      }
      this.addEventListener('dragenter', this);
      this.addEventListener('dragover', this);
      this.addEventListener('dragleave', this);
      this.addEventListener('drop', this);
      subs.add(this._subFn);
      // width%/height% in _applyView encode the frame aspect at call time —
      // a host resize (responsive grid, pane divider) would stretch the
      // image until the next _render. Re-render on size change: _render()
      // re-seeds _view from stored before clamp/apply, so a shrink→grow
      // cycle round-trips instead of ratcheting x/y toward the narrower
      // frame's clamp range.
      this._ro = new ResizeObserver(() => this._render());
      this._ro.observe(this);
      load();
      this._render();
    }

    disconnectedCallback() {
      subs.delete(this._subFn);
      this.removeEventListener('dragenter', this);
      this.removeEventListener('dragover', this);
      this.removeEventListener('dragleave', this);
      this.removeEventListener('drop', this);
      if (this._ro) { this._ro.disconnect(); this._ro = null; }
      this._exitReframe(false);
    }

    _enterReframe() {
      if (this.hasAttribute('data-reframe')) return;
      this.setAttribute('data-reframe', '');
      this._applyView();
      // Close on click outside (the spill handler stopPropagation()s so
      // in-image drags don't reach this) and on Escape. Listeners are held
      // on the instance so _exitReframe / disconnectedCallback can detach
      // exactly what was attached.
      this._outside = (e) => {
        if (e.composedPath && e.composedPath().includes(this)) return;
        this._exitReframe(true);
      };
      this._esc = (e) => { if (e.key === 'Escape') this._exitReframe(true); };
      document.addEventListener('pointerdown', this._outside, true);
      document.addEventListener('keydown', this._esc, true);
    }

    _exitReframe(commit) {
      if (!this.hasAttribute('data-reframe')) return;
      if (this._dragUp) this._dragUp();
      this.removeAttribute('data-reframe');
      this.removeAttribute('data-panning');
      if (this._outside) document.removeEventListener('pointerdown', this._outside, true);
      if (this._esc) document.removeEventListener('keydown', this._esc, true);
      this._outside = this._esc = null;
      if (commit) this._commitView();
    }

    attributeChangedCallback() { if (this.shadowRoot) this._render(); }

    // handleEvent — one listener object for all four drag events keeps the
    // add/remove symmetric and the depth counter correct.
    handleEvent(e) {
      if (e.type === 'dragenter' || e.type === 'dragover') {
        // Without preventDefault the browser never fires 'drop'.
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        if (e.type === 'dragenter') this._depth++;
        this.setAttribute('data-over', '');
      } else if (e.type === 'dragleave') {
        // dragenter/leave fire for every descendant crossing — count depth
        // so hovering the icon inside the empty state doesn't flicker.
        if (--this._depth <= 0) { this._depth = 0; this.removeAttribute('data-over'); }
      } else if (e.type === 'drop') {
        e.preventDefault();
        e.stopPropagation();
        this._depth = 0;
        this.removeAttribute('data-over');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) this._ingest(f);
      }
    }

    async _ingest(file) {
      this._setError(null);
      if (!file || ACCEPT.indexOf(file.type) < 0) {
        this._setError('Drop a PNG, JPEG, WebP, or AVIF image.');
        return;
      }
      // toDataUrl can take hundreds of ms on a large photo. A Clear or a
      // newer drop during that window would be clobbered when this await
      // resumes — bump + capture a generation so stale encodes bail.
      const gen = ++this._gen;
      try {
        const w = this.clientWidth || this.offsetWidth || MAX_DIM;
        const url = await toDataUrl(file, w);
        if (gen !== this._gen) return;
        // Only exit reframe once the new image is in hand — a rejected type
        // or decode failure leaves the in-progress crop untouched.
        this._exitReframe(false);
        const val = { u: url, s: 1, x: 0, y: 0 };
        setSlot(this.id || '', val);
        // Keep a session-local copy for id-less slots so the drop still
        // shows, even though it cannot persist.
        if (!this.id) { this._local = val; this._render(); }
      } catch (err) {
        if (gen !== this._gen) return;
        this._setError('Could not read that image.');
        console.warn('<image-slot> ingest failed:', err);
      }
    }

    _setError(msg) {
      if (this._err) { this._err.remove(); this._err = null; }
      if (!msg) return;
      const d = document.createElement('div');
      d.className = 'err'; d.textContent = msg;
      this.shadowRoot.appendChild(d);
      this._err = d;
      setTimeout(() => { if (this._err === d) { d.remove(); this._err = null; } }, 3000);
    }

    // Reframing (pan/resize) is only meaningful for fit=cover — contain/fill
    // keep the old object-fit path and double-click is a no-op.
    _reframes() {
      return this.hasAttribute('data-filled') &&
        (this.getAttribute('fit') || 'cover') === 'cover';
    }

    // Cover-baseline geometry, shared by clamp/apply/resize. Null until the
    // img has loaded (naturalWidth is 0 before that) or when the slot has no
    // layout box — ResizeObserver fires with a 0×0 rect under display:none,
    // and clamping against a degenerate 1×1 frame would silently pull the
    // stored pan toward zero.
    _geom() {
      const iw = this._img.naturalWidth, ih = this._img.naturalHeight;
      const fw = this.clientWidth, fh = this.clientHeight;
      if (!iw || !ih || !fw || !fh) return null;
      return { iw, ih, fw, fh, base: Math.max(fw / iw, fh / ih) };
    }

    _clampView() {
      // Pan range on each axis is half the overflow past the frame edge.
      const g = this._geom();
      if (!g) return;
      const mx = Math.max(0, (g.iw * g.base * this._view.s / g.fw - 1) * 50);
      const my = Math.max(0, (g.ih * g.base * this._view.s / g.fh - 1) * 50);
      this._view.x = Math.max(-mx, Math.min(mx, this._view.x));
      this._view.y = Math.max(-my, Math.min(my, this._view.y));
    }

    _applyView() {
      const g = this._geom();
      const fit = this.getAttribute('fit') || 'cover';
      if (fit !== 'cover' || !g) {
        // Non-cover, or dimensions not known yet (before img load).
        this._img.style.width = '100%';
        this._img.style.height = '100%';
        this._img.style.left = '50%';
        this._img.style.top = '50%';
        this._img.style.objectFit = fit;
        this._img.style.objectPosition = this.getAttribute('position') || '50% 50%';
        return;
      }
      // Cover baseline: img fills the frame on its tighter axis at s=1, so
      // pan works immediately on the overflowing axis without zooming first.
      // Width/height and left/top are all frame-% — depends only on the
      // frame aspect ratio, so a responsive resize keeps the same crop. The
      // spill layer mirrors the same box so its corners = image corners.
      const k = g.base * this._view.s;
      const w = (g.iw * k / g.fw * 100) + '%';
      const h = (g.ih * k / g.fh * 100) + '%';
      const l = (50 + this._view.x) + '%';
      const t = (50 + this._view.y) + '%';
      this._img.style.width = w; this._img.style.height = h;
      this._img.style.left = l; this._img.style.top = t;
      this._img.style.objectFit = '';
      this._spill.style.width = w; this._spill.style.height = h;
      this._spill.style.left = l; this._spill.style.top = t;
    }

    _commitView() {
      const v = { s: this._view.s, x: this._view.x, y: this._view.y };
      if (this._userUrl) v.u = this._userUrl;
      // Framing-only (no u) persists too so an author-src slot remembers its
      // crop; clearing the sidecar still falls through to src=.
      if (this.id) setSlot(this.id, v);
      else { this._local = v; }
    }

    _render() {
      // Shape / mask. Presets use border-radius so the dashed ring can
      // follow the rounded outline; clip-path is only applied for an
      // explicit `mask` (the ring is hidden there since a rectangle
      // dashed border chopped by an arbitrary polygon looks broken).
      const mask = this.getAttribute('mask');
      const shape = (this.getAttribute('shape') || 'rounded').toLowerCase();
      let radius = '';
      if (shape === 'circle') radius = '50%';
      else if (shape === 'pill') radius = '9999px';
      else if (shape === 'rounded') {
        const n = parseFloat(this.getAttribute('radius'));
        radius = (Number.isFinite(n) ? n : 12) + 'px';
      }
      this._frame.style.borderRadius = mask ? '' : radius;
      this._frame.style.clipPath = mask || '';
      this._ring.style.borderRadius = mask ? '' : radius;
      this._ring.style.display = mask ? 'none' : '';

      // Controls and reframe entry gate on this so share links stay read-only.
      const editable = !!(window.omelette && window.omelette.writeFile);
      this.toggleAttribute('data-editable', editable);
      this._sub.style.display = editable ? '' : 'none';

      // Content. The sidecar is also writable by the agent's write_file
      // tool, so its value isn't guaranteed canvas-originated — only accept
      // data:image/ URLs from it. The `src` attribute is author-controlled
      // (Claude wrote it into the HTML) so it passes through unchanged.
      let stored = this.id ? getSlot(this.id) : this._local;
      if (stored && stored.u && !/^data:image\//i.test(stored.u)) stored = null;
      const srcAttr = this.getAttribute('src') || '';
      this._userUrl = (stored && stored.u) || null;
      const url = this._userUrl || srcAttr;
      // Don't clobber an in-flight reframe with a store-triggered re-render.
      if (!this.hasAttribute('data-reframe')) {
        this._view = {
          s: stored && Number.isFinite(stored.s) ? clampS(stored.s) : 1,
          x: stored && Number.isFinite(stored.x) ? stored.x : 0,
          y: stored && Number.isFinite(stored.y) ? stored.y : 0,
        };
      }
      this._cap.textContent = this.getAttribute('placeholder') || 'Drop an image';
      // Toggle via style.display — the [hidden] attribute alone loses to
      // the display:flex / display:block rules in the stylesheet above.
      if (url) {
        if (this._img.getAttribute('src') !== url) {
          this._img.src = url;
          this._ghost.src = url;
        }
        this._img.style.display = 'block';
        this._empty.style.display = 'none';
        this.setAttribute('data-filled', '');
        this._clampView();
        this._applyView();
      } else {
        this._img.style.display = 'none';
        this._img.removeAttribute('src');
        this._ghost.removeAttribute('src');
        this._empty.style.display = 'flex';
        this.removeAttribute('data-filled');
      }
    }
  }

  if (!customElements.get('image-slot')) {
    customElements.define('image-slot', ImageSlot);
  }
})();
