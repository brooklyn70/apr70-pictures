<svg viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Standard US business card: 3.5" x 2" at 100px/inch -->
  <rect width="350" height="200" fill="#FFF"/>
  
  <!-- Name -->
  <text x="30" y="70" font-family="Futura, Futura-Bold, Century Gothic, sans-serif" font-size="16" font-weight="700" fill="#000" letter-spacing="0.08em">MARC ANDREW CARUSO</text>
  
  <!-- Contact info -->
  <text x="30" y="110" font-family="Futura, Century Gothic, sans-serif" font-size="11" font-weight="400" fill="#000" letter-spacing="0.04em">caruso@apr70.com</text>
  <text x="30" y="128" font-family="Futura, Century Gothic, sans-serif" font-size="11" font-weight="400" fill="#000" letter-spacing="0.04em">917.613.0728</text>
  
  <!-- Small monogram in corner -->
  <g transform="translate(280, 140)">
    <rect x="0" y="0" width="45" height="38" fill="#000"/>
    <rect x="3" y="6" width="3" height="2.1" rx="0.4" fill="#FFF"/>
    <rect x="3" y="12" width="3" height="2.1" rx="0.4" fill="#FFF"/>
    <rect x="3" y="18" width="3" height="2.1" rx="0.4" fill="#FFF"/>
    <rect x="3" y="24" width="3" height="2.1" rx="0.4" fill="#FFF"/>
    <rect x="3" y="30" width="3" height="2.1" rx="0.4" fill="#FFF"/>
    <rect x="39" y="6" width="3" height="2.1" rx="0.4" fill="#FFF"/>
    <rect x="39" y="12" width="3" height="2.1" rx="0.4" fill="#FFF"/>
    <rect x="39" y="18" width="3" height="2.1" rx="0.4" fill="#FFF"/>
    <rect x="39" y="24" width="3" height="2.1" rx="0.4" fill="#FFF"/>
    <rect x="39" y="30" width="3" height="2.1" rx="0.4" fill="#FFF"/>
    <text x="22.5" y="24" font-family="Futura, Futura-Bold, Century Gothic, sans-serif" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle" letter-spacing="0.06em">70</text>
