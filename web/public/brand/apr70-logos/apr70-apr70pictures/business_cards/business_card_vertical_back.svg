  <text x="25" y="100" font-family="Futura, Futura-Bold, Century Gothic, sans-serif" font-size="14" font-weight="700" fill="#000" letter-spacing="0.06em">CARUSO</text>
  
  <!-- Contact info -->
  <text x="25" y="150" font-family="Futura, Century Gothic, sans-serif" font-size="10" font-weight="400" fill="#000" letter-spacing="0.03em">caruso@apr70.com</text>
  <text x="25" y="168" font-family="Futura, Century Gothic, sans-serif" font-size="10" font-weight="400" fill="#000" letter-spacing="0.03em">917.613.0728</text>
  
  <!-- Small monogram at bottom -->
  <g transform="translate(77, 280)">
