  <rect x="300" y="20" width="8" height="5.6" rx="1" fill="#000"/>
  <rect x="300" y="34" width="8" height="5.6" rx="1" fill="#000"/>
  <rect x="300" y="48" width="8" height="5.6" rx="1" fill="#000"/>
  <rect x="300" y="62" width="8" height="5.6" rx="1" fill="#000"/>
  <rect x="300" y="76" width="8" height="5.6" rx="1" fill="#000"/>
  <!-- APR 70 text - Futura Bold -->
  <text x="160" y="58" font-family="Futura, Futura-Bold, Century Gothic, sans-serif" font-size="38" font-weight="700" fill="#000" text-anchor="middle" letter-spacing="0.18em">APR 70</text>
  <!-- PICTURES tagline - Futura, lighter weight, tracked out -->
  <text x="160" y="85" font-family="Futura, Century Gothic, sans-serif" font-size="14" font-weight="400" fill="#000" text-anchor="middle" letter-spacing="0.5em">PICTURES</text>
