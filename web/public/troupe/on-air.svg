<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="Placeholder line art: ON AIR studio lamp">
  <!-- PLACEHOLDER artwork, hand-drawn line art. Palette tokens only:
       212-sicilian-orange #E85D04 / 310-imax #077082 / nrc-grey #c8c8c8.
       To be replaced by a PD-verified photograph (see vault pd-image-ledger-troupe.md). -->

  <!-- sprocket-hole strips -->
  <g fill="#c8c8c8" fill-opacity="0.45">
    <rect x="22" y="40"  width="26" height="20" rx="2"/>
    <rect x="22" y="130" width="26" height="20" rx="2"/>
    <rect x="22" y="220" width="26" height="20" rx="2"/>
    <rect x="22" y="310" width="26" height="20" rx="2"/>
    <rect x="22" y="400" width="26" height="20" rx="2"/>
    <rect x="22" y="490" width="26" height="20" rx="2"/>
    <rect x="22" y="580" width="26" height="20" rx="2"/>
    <rect x="22" y="670" width="26" height="20" rx="2"/>
    <rect x="552" y="40"  width="26" height="20" rx="2"/>
    <rect x="552" y="130" width="26" height="20" rx="2"/>
    <rect x="552" y="220" width="26" height="20" rx="2"/>
    <rect x="552" y="310" width="26" height="20" rx="2"/>
    <rect x="552" y="400" width="26" height="20" rx="2"/>
    <rect x="552" y="490" width="26" height="20" rx="2"/>
    <rect x="552" y="580" width="26" height="20" rx="2"/>
    <rect x="552" y="670" width="26" height="20" rx="2"/>
  </g>

  <!-- radiating "lit" ticks -->
  <g stroke="#E85D04" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7">
    <line x1="140" y1="200" x2="110" y2="170"/>
    <line x1="460" y1="200" x2="490" y2="170"/>
    <line x1="140" y1="440" x2="110" y2="470"/>
    <line x1="460" y1="440" x2="490" y2="470"/>
    <line x1="300" y1="150" x2="300" y2="110"/>
  </g>

  <!-- lamp frame, double box -->
  <rect x="130" y="190" width="340" height="260" rx="18" fill="none" stroke="#077082" stroke-width="7"/>
  <rect x="152" y="212" width="296" height="216" rx="10" fill="none" stroke="#E85D04" stroke-width="5"/>

  <!-- lamp text -->
  <text x="300" y="340" text-anchor="middle" font-family="'Share Tech Mono','Courier New',monospace" font-size="64" letter-spacing="22" fill="#E85D04">ON AIR</text>

  <!-- wall mount -->
  <g fill="none" stroke="#077082" stroke-width="6" stroke-linecap="round">
    <line x1="300" y1="450" x2="300" y2="530"/>
    <line x1="230" y1="530" x2="370" y2="530"/>
  </g>

  <text x="300" y="640" text-anchor="middle" font-family="'Share Tech Mono','Courier New',monospace" font-size="30" letter-spacing="12" fill="#077082">APR 70 TROUPE</text>
  <text x="300" y="690" text-anchor="middle" font-family="'Share Tech Mono','Courier New',monospace" font-size="18" letter-spacing="8" fill="#c8c8c8">PLACEHOLDER</text>
