  <!-- (212) — v1 layout, scaled 0.7. Parens dominant (140), digits crushed (120, letter-spacing -6).
       The character deltas preserve v1's overlap geometry:
         • "(" → "2": 35px (paren visually swallows digit's left edge — 28px overlap)
         • "2" → "1": 56px (15px digit-on-digit overlap)
         • "1" → "2": 38px (30px overlap — the asymmetric crush v1 had)
         • "2" → ")": 42px (paren swallows the right edge)
       Off-center right by ~16 to preserve the falling-forward quirk. -->
  <!-- PICTURES — tracked tighter (8 instead of 14), font 30, brought up to y=275.
       Width stays well inside the parens lockup (which spans 149→383 ≈ 234px wide). -->
  <text
     x="261.32016"
     y="252.82706"
     font-family="'Futura Std', Futura, Arial, sans-serif"
