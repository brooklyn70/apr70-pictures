<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" aria-label="(310) Pictures v3 — full-canvas keypad: PICTURES on top rows, 310 on bottom row">
  <title>(310) Pictures — v3 Keypad/PICTURES Integration</title>
  <desc>The 12-button keypad becomes the entire mark. P-I-C-T-U-R-E-S occupy positions 1-8 (the top 2.5 rows). The bottom row literally shows 3-1-0 — the area code as if dialed.</desc>

  <!-- Grid geometry: 3 columns × 4 rows, button cells 90×90 with 10px gutter -->
  <!-- Columns center x: 140, 250, 360 (spacing 110) -->
  <!-- Rows center y: 70, 165, 260, 380 -->

  <!-- TOP THREE ROWS — PICTURES letters (P,I,C / T,U,R / E,S,blank) -->
  <g id="pictures-cells" font-family="Futura Std, Futura, Arial Black, sans-serif" font-weight="900" font-size="64" letter-spacing="-1" text-anchor="middle" stroke="none">
    <!-- Hairline button outlines -->
    <g fill="none" stroke="#077082" stroke-width="1.2">
      <rect x="95" y="25" width="90" height="90"/>
      <rect x="205" y="25" width="90" height="90"/>
      <rect x="315" y="25" width="90" height="90"/>
      <rect x="95" y="120" width="90" height="90"/>
      <rect x="205" y="120" width="90" height="90"/>
      <rect x="315" y="120" width="90" height="90"/>
      <rect x="95" y="215" width="90" height="90"/>
      <rect x="205" y="215" width="90" height="90"/>
    </g>
    <!-- The 9th cell (position of "9" key) is deliberately empty to emphasize the asymmetry -->

    <text id="letter-P" x="140" y="92" fill="#077082">P</text>
    <text id="letter-I" x="250" y="92" fill="#077082">I</text>
    <text id="letter-C" x="360" y="92" fill="#077082">C</text>
    <text id="letter-T" x="140" y="187" fill="#077082">T</text>
    <text id="letter-U" x="250" y="187" fill="#077082">U</text>
    <text id="letter-R" x="360" y="187" fill="#077082">R</text>
    <text id="letter-E" x="140" y="282" fill="#077082">E</text>
    <text id="letter-S" x="250" y="282" fill="#077082">S</text>
  </g>

  <!-- BOTTOM ROW — area code 3-1-0, FILLED buttons (inverted: teal fill, white digits) -->
  <g id="area-code-cells">
    <rect id="cell-3" x="95"  y="335" width="90" height="90" fill="#077082" stroke="none"/>
    <rect id="cell-1" x="205" y="335" width="90" height="90" fill="#0077B6" stroke="none"/>
    <rect id="cell-0" x="315" y="335" width="90" height="90" fill="#077082" stroke="none"/>
    <g font-family="Futura Std, Futura, Arial Black, sans-serif" font-weight="900" font-size="64" letter-spacing="-1" text-anchor="middle" fill="#FFFFFF" stroke="none">
      <text x="140" y="402">3</text>
      <text x="250" y="402">1</text>
      <text x="360" y="402">0</text>
    </g>
  </g>

  <!-- Subtle dial-path connector across the bottom row (the act of "dialing 310") -->
  <line x1="140" y1="380" x2="360" y2="380" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Optional caption beneath (very small, monospace meta) -->
  <text id="caption" x="250" y="460" font-family="Futura Std, Futura, Arial, sans-serif" font-weight="500" font-size="10" letter-spacing="5" text-anchor="middle" fill="#077082" stroke="none">A DIVISION OF APR 70 PICTURES</text>
</svg>
