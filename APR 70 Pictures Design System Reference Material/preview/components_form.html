<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&display=swap"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="min-height:180px; padding:20px 24px;">
  <div class="tag" style="margin-bottom:16px;">FORM INPUTS</div>
  <div style="display:flex; flex-direction:column; gap:16px;">
    <div>
      <div style="font-family:'Barlow',sans-serif; font-weight:500; font-size:9px; letter-spacing:0.4em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:6px;">NAME</div>
      <input value="Marc Andrew Caruso" style="background:transparent; border:0; border-bottom:1px solid rgba(255,255,255,0.2); color:#fff; font-family:'Barlow',sans-serif; font-weight:300; font-size:14px; padding:6px 0; width:100%; letter-spacing:0.02em;">
    </div>
    <div>
      <div style="font-family:'Barlow',sans-serif; font-weight:500; font-size:9px; letter-spacing:0.4em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:6px;">INQUIRY</div>
      <input placeholder="Subject..." style="background:transparent; border:0; border-bottom:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.4); font-family:'Barlow',sans-serif; font-weight:300; font-size:14px; padding:6px 0; width:100%; letter-spacing:0.02em;">
    </div>
  </div>
</div>
</body></html>
