<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APR 70 Pictures — Website UI Kit</title>
<link rel="icon" type="image/svg+xml" href="../../assets/apr70_favicon_white.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="DivisionRow.jsx"></script>
<script type="text/babel" src="ProjectCard.jsx"></script>
<script type="text/babel" src="ContactGrid.jsx"></script>
<script type="text/babel" src="TaglineBand.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const PROJECTS = [
  { project: 'A Need Grows in Brooklyn', division: '(212) PICTURES', divColor: '#824B07', tag: 'TV · 10 EPS', year: '2026', desc: 'Coming-of-age crime drama. Ten episodes. Set in the Brooklyn of the mid-1990s.' },
  { project: 'The Mayors',                division: '(212) PICTURES', divColor: '#824B07', tag: 'DOC · 11 EPS', year: '2026', desc: 'Eleven-episode documentary series spanning 75 years of New York City leadership.' },
  { project: 'The Maltese Falcon',        division: '(212) PICTURES', divColor: '#824B07', tag: 'STAGE / MUSICAL', year: '2027', desc: 'Theater-musical adaptation. All-Italian-American cast. San Francisco noir transposed to 1940s Brooklyn.' },
  { project: 'Alpha YY',                  division: '(212) PICTURES', divColor: '#824B07', tag: 'TV', year: '2027', desc: 'Written by Mike Diaz. A feature version is also developed through New Renaissance Cinema.' },
  { project: 'The Movement',              division: '(212) PICTURES', divColor: '#824B07', tag: 'TV', year: '2027', desc: 'Series in development.' },
  { project: 'L.A. Dolce Vita',           division: '(310) PICTURES', divColor: '#077082', tag: 'TV · 10 EPS', year: '2027', desc: 'Political thriller / neo-noir. Ten episodes. Budgeted $30M–$50M. Universe Bible complete.' },
  { project: "L'Odissea di Cleopatra",    division: '(310) PICTURES', divColor: '#077082', tag: 'TV · 10 EPS', year: '2028', desc: 'Science fiction / psychological thriller. Ten episodes. Budgeted $40M–$80M.' },
  { project: 'Shadowmaster',              division: '(310) PICTURES', divColor: '#077082', tag: 'HYBRID', year: '2028', desc: 'Series / reality hybrid format.' },
  { project: 'U Brucculinu',              division: 'NEW RENAISSANCE CINEMA', divColor: '#c8c8c8', tag: 'FEATURE', year: '2027', desc: 'Feature film. Sicilian-American story, told on Caruso sensibility.' },
];

function Home({ go }) {
  return (
    <div>
      <Hero onExplore={go} />
      <SectionHeader
        kicker="APR 70 — EST. 2026"
        title="The classics never go out of style."
        sub="APR 70 develops and produces original content across three specialized divisions. New York and Los Angeles television; auteur-driven features. Precise, purposeful, and built to last."
      />
      <DivisionRow
        num="01 / DIVISION"
        ghost="212"
        title={<>New York.<br/>Television.</>}
        tagline="(212) PICTURES · NEW YORK TV LABEL"
        subtitle="Character-driven drama, crime, and documentary rooted in the American Northeast. Named for the original Manhattan area code — a signal of borough identity and urban specificity."
        color="#824B07"
        projects={[
          { name: 'A NEED GROWS IN BROOKLYN', meta: '10 EPS' },
          { name: 'THE MAYORS', meta: 'DOC · 11 EPS' },
          { name: 'THE MALTESE FALCON', meta: 'STAGE' },
          { name: 'ALPHA YY', meta: 'TV' },
        ]}
        onEnter={() => go('slate')}
      />
      <DivisionRow
        num="02 / DIVISION"
        ghost="310"
        title={<>Los Angeles.<br/>Global.</>}
        tagline="(310) PICTURES · LA / GLOBAL TV LABEL"
        subtitle="Elevated genre work — political thrillers, science fiction, and hybrid formats that can travel internationally and compete at the top of the prestige television market."
        color="#077082"
        projects={[
          { name: 'L.A. DOLCE VITA', meta: '$30–50M' },
          { name: "L'ODISSEA DI CLEOPATRA", meta: '$40–80M' },
          { name: 'SHADOWMASTER', meta: 'HYBRID' },
        ]}
        onEnter={() => go('slate')}
      />
      <DivisionRow
        num="03 / DIVISION"
        ghost="NRC"
        title={<>Features.<br/>Auteur.</>}
        tagline="NEW RENAISSANCE CINEMA · FEATURE DIVISION"
        subtitle="Auteur-driven cinema built on timeless themes, moral clarity, and production precision. Classic stories for modern audiences — Capra, Fellini, Hitchcock lineage."
        color="#c8c8c8" textColor="#1c1208"
        projects={[
          { name: 'U BRUCCULINU', meta: 'FEATURE' },
          { name: 'A NEED GROWS IN BROOKLYN', meta: 'FEATURE' },
          { name: 'ALPHA YY', meta: 'FEATURE' },
        ]}
        onEnter={() => go('slate')}
      />
      <TaglineBand onSlate={() => go('slate')} onDivisions={() => go('divisions')} />
    </div>
  );
}

function SlatePage({ go }) {
  const [filter, setFilter] = useState('ALL');
  const filters = ['ALL', 'TV', 'FEATURE', 'STAGE', 'HYBRID', 'DOC'];
  const visible = PROJECTS.filter(p => {
    if (filter === 'ALL') return true;
    if (filter === 'TV') return p.tag.startsWith('TV');
    if (filter === 'FEATURE') return p.tag.includes('FEATURE');
    if (filter === 'STAGE') return p.tag.includes('STAGE');
    if (filter === 'HYBRID') return p.tag.includes('HYBRID');
    if (filter === 'DOC') return p.tag.includes('DOC');
    return true;
  });
  return (
    <div className="slate-page">
      <div className="slate-hero">
        <span className="mono" style={{ fontSize: 11, letterSpacing: '0.4em', color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase' }}>02 / SLATE — {visible.length} OF {PROJECTS.length}</span>
        <h1>Slate.</h1>
        <p>Development, preproduction, and production across three divisions.</p>
      </div>
      <div className="slate-filters">
        {filters.map(f => (
          <button key={f} className={`slate-filter ${filter === f ? 'is-active' : ''}`} onClick={() => setFilter(f)}>{f}</button>
        ))}
      </div>
      <div className="slate-grid">
        {visible.map((p, i) => (
          <ProjectCard key={i} idx={i + 1} {...p} />
        ))}
      </div>
    </div>
  );
}

function DivisionsPage({ go }) {
  return (
    <div>
      <SectionHeader
        kicker="01 / DIVISIONS"
        title={<>Three divisions.<br/>One vision.</>}
        sub="APR 70 operates across two primary categories of content — television and feature film — through three divisions, each with a defined mandate and aesthetic identity. More divisions forthcoming for theater, radio and books."
      />
      <DivisionRow num="01" ghost="212" title="(212) Pictures" tagline="NEW YORK · TELEVISION"
        subtitle="Character-driven drama, crime, and documentary rooted in the Northeast." color="#824B07"
        projects={[{ name: 'A NEED GROWS', meta: '10 EPS' }, { name: 'THE MAYORS', meta: 'DOC' }]} onEnter={() => go('slate')} />
      <DivisionRow num="02" ghost="310" title="(310) Pictures" tagline="LOS ANGELES · GLOBAL TV"
        subtitle="Elevated genre — political thrillers, science fiction, hybrid formats." color="#077082"
        projects={[{ name: 'L.A. DOLCE VITA', meta: '$30–50M' }, { name: "L'ODISSEA", meta: '$40–80M' }]} onEnter={() => go('slate')} />
      <DivisionRow num="03" ghost="NRC" title="New Renaissance Cinema" tagline="FEATURE DIVISION"
        subtitle="Auteur-driven cinema built on timeless themes and moral clarity." color="#c8c8c8" textColor="#1c1208"
        projects={[{ name: 'U BRUCCULINU', meta: 'FEATURE' }, { name: 'ALPHA YY', meta: 'FEATURE' }]} onEnter={() => go('slate')} />
      <TaglineBand onSlate={() => go('slate')} onDivisions={() => go('divisions')} />
    </div>
  );
}

function PartnersPage({ go }) {
  return (
    <div>
      <SectionHeader
        kicker="03 / PARTNERS"
        title="Partners."
        sub="APR 70 is actively engaging investors, distributors, and co-production partners for its 2026–2028 slate. Inquiries handled directly by the founder."
      />
      <div style={{ maxWidth: 900, margin: '0 auto', padding: '0 var(--pad-x) 120px' }}>
        <div style={{ border: '1px solid rgba(255,255,255,0.08)', padding: 48 }}>
          <div className="mono" style={{ fontSize: 10, letterSpacing: '0.4em', color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', marginBottom: 16 }}>PROSPECTUS</div>
          <div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 32, letterSpacing: '-0.02em', textTransform: 'uppercase', lineHeight: 1, marginBottom: 24 }}>APR 70 LLC — 2026 Investor Package</div>
          <p style={{ color: 'rgba(255,255,255,0.6)', lineHeight: 1.7, marginBottom: 32 }}>Complete package: company overview, founder bio, active slate dossiers, financial structure, and anticipated deployment timelines.</p>
          <button className="btn-solid">REQUEST DOSSIER →</button>
        </div>
      </div>
    </div>
  );
}

function ContactPage() {
  return (
    <div className="contact-wrap">
      <SectionHeader kicker="04 / CONTACT" title="Direct." sub="Currently accepting select projects for 2026." />
      <ContactGrid />
    </div>
  );
}

function App() {
  const [page, setPage] = useState(() => localStorage.getItem('apr70-page') || 'home');
  const go = (p) => { setPage(p); localStorage.setItem('apr70-page', p); window.scrollTo(0, 0); };
  const accent = page === 'slate' || page === 'divisions' ? '#E85D04' : '#077082';

  return (
    <>
      <FilmstripRail accentColor={accent} keycode={`APR 70 PICTURES // ${page.toUpperCase()} // REEL 086`} />
      <Nav current={page} onNav={go} />
      <div className="page">
        {page === 'home' && <Home go={go} />}
        {page === 'slate' && <SlatePage go={go} />}
        {page === 'divisions' && <DivisionsPage go={go} />}
        {page === 'partners' && <PartnersPage go={go} />}
        {page === 'contact' && <ContactPage />}
      </div>
      <SiteFooter />
      <CornerAccent />
    </>
  );
}

setTimeout(() => {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}, 100);
</script>
</body>
</html>
