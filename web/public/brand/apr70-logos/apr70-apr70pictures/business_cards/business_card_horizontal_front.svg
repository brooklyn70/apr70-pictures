<svg viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Standard US business card: 3.5" x 2" at 100px/inch -->
  <rect width="350" height="200" fill="#000"/>
  
  <!-- Centered logo -->
  <g transform="translate(95, 65)">
    <!-- Left sprocket holes -->
    <rect x="12" y="10" width="6" height="4.2" rx="0.8" fill="#FFF"/>
    <rect x="12" y="22" width="6" height="4.2" rx="0.8" fill="#FFF"/>
    <rect x="12" y="34" width="6" height="4.2" rx="0.8" fill="#FFF"/>
    <rect x="12" y="46" width="6" height="4.2" rx="0.8" fill="#FFF"/>
    <rect x="12" y="58" width="6" height="4.2" rx="0.8" fill="#FFF"/>
    <!-- Right sprocket holes -->
    <rect x="142" y="10" width="6" height="4.2" rx="0.8" fill="#FFF"/>
    <rect x="142" y="22" width="6" height="4.2" rx="0.8" fill="#FFF"/>
    <rect x="142" y="34" width="6" height="4.2" rx="0.8" fill="#FFF"/>
    <rect x="142" y="46" width="6" height="4.2" rx="0.8" fill="#FFF"/>
    <rect x="142" y="58" width="6" height="4.2" rx="0.8" fill="#FFF"/>
    <!-- APR 70 text -->
    <text x="80" y="42" font-family="Futura, Futura-Bold, Century Gothic, sans-serif" font-size="24" font-weight="700" fill="#FFF" text-anchor="middle" letter-spacing="0.18em">APR 70</text>
  </g>
</svg>
