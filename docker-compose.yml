services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apr70_cms
    # No host port binding — DSM already listens on 127.0.0.1:5432 and the
    # conflict prevents postgres from re-attaching to apr70v3_default on
    # restart. v3 services reach it over the compose network via service
    # name. For ad-hoc psql from the host use `docker exec apr70v3-postgres-1 psql ...`.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/apr70_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-change-me}
      NODE_ENV: development
    volumes:
      - cms_media:/app/media
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/globals/site-settings || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    profiles: [seed]
    build:
      context: ./cms
      dockerfile: Dockerfile
      target: seeder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/apr70_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-change-me}
      NODE_ENV: development
    command: ["node_modules/.bin/payload", "migrate"]
    restart: "no"

  cms-seeder:
    profiles: [seed]
    build:
      context: ./cms
      dockerfile: Dockerfile
      target: seeder
    depends_on:
      postgres:
        condition: service_healthy
      cms:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/apr70_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-change-me}
      NODE_ENV: development
      CMS_URL: http://cms:3000
      V2_CONTENT_ROOT: /v2-export/content
      PAYLOAD_SEED_EMAIL: ${PAYLOAD_SEED_EMAIL}
      PAYLOAD_SEED_PASSWORD: ${PAYLOAD_SEED_PASSWORD}
    volumes:
      - cms_media:/app/media
      - ./v2-export:/v2-export:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
    environment:
      PUBLIC_PAYLOAD_URL: http://cms:3000

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - '8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  cms_media:
