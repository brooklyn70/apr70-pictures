services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apr70_cms
    # No host port binding — DSM already listens on 127.0.0.1:5432 and the
    # conflict prevents postgres from re-attaching to apr70v3_default on
    # restart. v3 services reach it over the compose network via service
    # name. For ad-hoc psql from the host use `docker exec apr70v3-postgres-1 psql ...`.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/apr70_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-change-me}
      NODE_ENV: development
    volumes:
      - cms_media:/app/media

  cms-seeder:
    profiles: [seed]
    build:
      context: ./cms
      dockerfile: Dockerfile
      target: seeder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/apr70_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-change-me}
      NODE_ENV: development
    volumes:
      - cms_media:/app/media
      - ./v2-export:/v2-export:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - cms
      - web
    ports:
      - '8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  cms_media:
